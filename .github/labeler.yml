# Path -> CATEGORY label map for the auto-labeller (actions/labeler@v5).
# These say what a PR touches. The single PRIMARY risk label (auto-safe /
# figures-moved / owner-decision / blocked) is projected from the Merge Card
# by the risk-label gate. No path can tell you whether a change needs the
# owner. See docs/RISK_LABELS.md.

engine:
  - changed-files:
      - any-glob-to-any-file:
          - 'public/forecast.js'

published-figures:
  - changed-files:
      - any-glob-to-any-file:
          - 'data.json'
          - 'public/periods.json'
          - 'docs/positions.csv'

plan-page:
  - changed-files:
      - any-glob-to-any-file:
          - 'public/plan.js'
          - 'public/index.html'

authority-docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/ACCOUNT_FACTS.md'
          - 'docs/00_MASTER_PICTURE.md'
          - 'docs/01_OPEN_QUESTIONS.md'
          - 'CONTEXT.md'
          - 'ARCHITECTURE.md'

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'server.js'
          - '.githooks/**'
          - 'scripts/privacy-guard.js'
          - '.github/workflows/privacy-guard.yml'
          - '.gitignore'
          - 'render.yaml'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'

evidence-only:
  - changed-files:
      - any-glob-to-any-file:
          - 'public/deepdive.*'
          - 'public/records.*'
          - 'public/modellers.*'

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - 'package.json'
          - 'package-lock.json'
