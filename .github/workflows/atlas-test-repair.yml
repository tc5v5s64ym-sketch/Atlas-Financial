name: Atlas test repair

# Failed normal checks remain failures. workflow_run uses trusted default-main
# code. No model, failed-log prompt, patch artifact or automatic push is allowed
# without private transport. This bounded hold does not suppress any test or
# infer review PASS; use a reviewed local repair while it is in force.
on:
  workflow_run:
    workflows: ["tests", "Merge card check"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: atlas-test-repair-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve failed PR and withhold unsafe automated repair
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node trusted/scripts/ci-output.js --identity atlas-test-repair-gate -- node trusted/scripts/ci-repair-privacy.js test-failure
