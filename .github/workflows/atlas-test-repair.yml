name: Atlas test repair

# When tests or the merge-card completeness check fail on a PR to main, start
# one Cursor repair. The patch is tested before it is pushed. Two failed
# attempts stop and tell the owner — they do not loop forever.
# Never weakens a financial test to go green. Never merges. Never spends
# OpenAI. Secret-bearing; workflow_run always uses this file from main.
on:
  workflow_run:
    workflows: ["tests", "Merge card check"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: atlas-test-repair-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ATLAS_CURSOR_MODEL: ${{ vars.ATLAS_CURSOR_MODEL }}
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Resolve the failed PR and stay inside the cap
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail

          pr_number="${RUN_PR}"
          if [[ -z "${pr_number}" && "${RUN_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
            prs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RUN_HEAD}/pulls" --jq '.[].number')"
            pr_number="$(printf '%s\n' "${prs}" | head -n 1)"
          fi
          if [[ -z "${pr_number}" ]]; then
            echo "No pull request for this failed run. Skip."
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
          if [[ "${state}" != "open" || "${base_ref}" != "main" || "${draft}" == "true" ]]; then
            echo "Not an open non-draft PR targeting main. Skip."
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          comments="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" --jq '.[].body')"
          rounds="$(printf '%s\n' "${comments}" | grep -c '<!-- atlas-test-repair-state -->' || true)"
          if (( rounds >= 2 )); then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" -f body="$(cat <<EOF
          Auto-repair stopped after 2 attempts on \`${head_sha}\`.

          The ${FAILED_WORKFLOW} check is still red. This needs a person — do not keep looping.

          <!-- atlas-test-repair-state -->
          EOF
          )"
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          set +e
          gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log-failed \
            > "${RUNNER_TEMP}/failed-check.log"
          log_status=$?
          set -e
          if [[ "${log_status}" -ne 0 || ! -s "${RUNNER_TEMP}/failed-check.log" ]]; then
            echo "Could not load failed-job logs for run ${RUN_ID}."
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tail -c 20000 "${RUNNER_TEMP}/failed-check.log" > "${RUNNER_TEMP}/failed-check.tail"
          mv "${RUNNER_TEMP}/failed-check.tail" "${RUNNER_TEMP}/failed-check.log"

          echo "eligible=true" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
          echo "round=$((rounds + 1))" >> "${GITHUB_OUTPUT}"

      - name: Checkout the failed PR head
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: pr-worktree

      - name: Install Cursor CLI
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${ATLAS_CURSOR_MODEL}" ]]; then
            echo "Repository variable ATLAS_CURSOR_MODEL is unset. Fail closed."
            exit 1
          fi
          curl -fsS https://cursor.com/install | bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Ask Cursor to fix the failed check
        if: steps.gate.outputs.eligible == 'true'
        working-directory: pr-worktree
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          sandbox="$(mktemp -d "${RUNNER_TEMP:-/tmp}/atlas-cursor-bin.XXXXXX")"
          real_git="$(command -v git)"
          install -m 0755 "${GITHUB_WORKSPACE}/trusted/scripts/atlas-cursor-repair-deny-git.sh" "${sandbox}/git"
          install -m 0755 "${GITHUB_WORKSPACE}/trusted/scripts/atlas-cursor-repair-deny-gh.sh" "${sandbox}/gh"
          cat > "${RUNNER_TEMP}/repair-prompt.txt" <<EOF
          Atlas auto-repair for PR #${{ steps.gate.outputs.pr_number }} at ${{ steps.gate.outputs.head_sha }}.

          The GitHub check failed. Fix the product or the merge card so \`npm test\` and merge-card completeness go green.

          Hard rules:
          - Do not weaken, delete, skip, or rewrite a financial / invariant test just to go green.
          - Do not invent household figures or change verified facts.
          - Do not merge, push, commit, or edit git history. File edits only.
          - Do not add paid APIs or new review SHA locks.
          - Stay inside this failure. Do not start other work.

          Failed-check log (tail):
          EOF
          cat "${RUNNER_TEMP}/failed-check.log" >> "${RUNNER_TEMP}/repair-prompt.txt"

          env -u GITHUB_TOKEN -u GH_TOKEN -u ATLAS_AUTOMATION_TOKEN \
            PATH="${sandbox}:${HOME}/.local/bin:/usr/bin:/bin" \
            CURSOR_API_KEY="${CURSOR_API_KEY}" \
            ATLAS_REAL_GIT="${real_git}" \
            cursor-agent --print --trust --force \
              --workspace "${GITHUB_WORKSPACE}/pr-worktree" \
              --model "${ATLAS_CURSOR_MODEL}" \
              --output-format text \
              "$(cat "${RUNNER_TEMP}/repair-prompt.txt")"

          git -C "${GITHUB_WORKSPACE}/pr-worktree" add -A
          if git -C "${GITHUB_WORKSPACE}/pr-worktree" diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${{ steps.gate.outputs.pr_number }}/comments" -f body="$(cat <<EOF
          Auto-repair round ${{ steps.gate.outputs.round }} made no file changes for the failed check on \`${{ steps.gate.outputs.head_sha }}\`.

          One more automatic try is allowed if the check is still red. After that it stops.

          <!-- atlas-test-repair-state -->
          EOF
          )"
          else
            git -C "${GITHUB_WORKSPACE}/pr-worktree" diff --cached > "${RUNNER_TEMP}/repair.patch"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
        id: cursor

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.eligible == 'true' && steps.cursor.outputs.changed == 'true'
        with:
          node-version: '20'

      - name: Prove the patch on a clean copy of the failed head
        if: steps.gate.outputs.eligible == 'true' && steps.cursor.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git -C pr-worktree reset --hard "${{ steps.gate.outputs.head_sha }}"
          git -C pr-worktree apply "${RUNNER_TEMP}/repair.patch"
          (cd pr-worktree && npm test)

      - name: Push only a tested repair
        if: steps.gate.outputs.eligible == 'true' && steps.cursor.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          token: ${{ secrets.ATLAS_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: push-worktree

      - name: Commit the tested patch
        if: steps.gate.outputs.eligible == 'true' && steps.cursor.outputs.changed == 'true'
        working-directory: push-worktree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          GATED_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "${live}" != "${GATED_SHA}" ]]; then
            echo "Live head moved to ${live}. Skip push rather than overwrite."
            exit 0
          fi
          git apply "${RUNNER_TEMP}/repair.patch"
          git add -A
          git config core.hooksPath .githooks
          git config user.name atlas-automation
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Auto-repair failed check on ${GATED_SHA} (round ${{ steps.gate.outputs.round }})."
          git push
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$(cat <<EOF
          Auto-repair round ${{ steps.gate.outputs.round }} pushed a tested fix for the failed check on \`${GATED_SHA}\`.

          Checks should re-run. If they go red again, one more automatic try is allowed.

          <!-- atlas-test-repair-state -->
          EOF
          )"
