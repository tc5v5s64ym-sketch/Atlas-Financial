name: Codex cursor repair

# workflow_run / workflow_dispatch use trusted default-branch code. Genuine
# exact-head Atlas review recording and PASS card dispatch stay active.
# Automatic repair fails closed before model execution or plaintext artifact
# creation/export: no private cross-job patch transport is configured.
# Local repair, normal correctness checks and genuine review remain required.
on:
  workflow_run:
    workflows: ["Codex cursor repair dispatch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number that received a Codex or trusted Atlas review
        required: true
        type: number
      review_id:
        description: Optional GitHub pull-request review id
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: atlas-cursor-repair-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate genuine review and withhold unsafe automated repair
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPATCH_REVIEW: ${{ inputs.review_id }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci-output.js --identity codex-review-gate -- node scripts/ci-repair-privacy.js codex-review
