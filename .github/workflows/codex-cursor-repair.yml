name: Codex cursor repair

# Secret-bearing path. workflow_run and workflow_dispatch always use this
# file from the default branch. It re-validates the review through the API
# and never executes PR-head scripts in a job that has secrets.
# After that revalidation it may edit the PR review block: PASS / NOT PASS /
# BLOCKING from a trusted Atlas review, or PENDING after a repair push whose
# live PR head has converged to the locally pushed SHA. It never infers PASS.
# After a trusted PASS card-sync it starts a fresh Merge Card check on the
# same PR head via workflow_dispatch. It does not rely on pull_request edited
# from GITHUB_TOKEN, which GitHub does not chain. It does not infer PASS,
# merge, or write financial state.
# pull-requests:write is the minimum permission needed to edit the PR body;
# actions:write is the minimum permission needed to dispatch Merge Card check;
# the dispatcher remains read-only.
on:
  workflow_run:
    workflows: ["Codex cursor repair dispatch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number that received a Codex or trusted Atlas review
        required: true
        type: number
      review_id:
        description: Optional GitHub pull-request review id
        required: false
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: atlas-cursor-repair-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.evaluate.outputs.eligible }}
      pr_number: ${{ steps.evaluate.outputs.pr_number }}
      head_sha: ${{ steps.evaluate.outputs.head_sha }}
      head_ref: ${{ steps.evaluate.outputs.head_ref }}
      reviewed_sha: ${{ steps.evaluate.outputs.reviewed_sha }}
      review_id: ${{ steps.evaluate.outputs.review_id }}
      next_round: ${{ steps.evaluate.outputs.next_round }}
      lane: ${{ steps.evaluate.outputs.lane }}
      card_outcome: ${{ steps.evaluate.outputs.card_outcome }}
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate repair eligibility
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPATCH_REVIEW: ${{ inputs.review_id }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            pr_number="${DISPATCH_PR}"
          elif [[ -n "${RUN_PR}" ]]; then
            pr_number="${RUN_PR}"
          else
            prs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RUN_HEAD}/pulls" --jq '.[].number')"
            pr_number="$(printf '%s\n' "${prs}" | head -n 1)"
          fi

          if [[ -z "${pr_number}" ]]; then
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            echo "No pull request could be resolved."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          current_head="$(jq -r '.head.sha' <<<"${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"

          reviews_file="$(mktemp "${RUNNER_TEMP:-/tmp}/atlas-codex-reviews.XXXXXX")"
          comments_file="$(mktemp "${RUNNER_TEMP:-/tmp}/atlas-codex-review-comments.XXXXXX")"
          state_file="$(mktemp "${RUNNER_TEMP:-/tmp}/atlas-repair-state-comments.XXXXXX")"
          trap 'rm -f "${reviews_file}" "${comments_file}" "${state_file}"' EXIT

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews" \
            --jq '.[]' > "${reviews_file}.ndjson"
          jq -s '.' "${reviews_file}.ndjson" > "${reviews_file}"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
            --jq '.[].body' > "${state_file}"

          card_review_id="${DISPATCH_REVIEW}"
          if [[ -z "${card_review_id}" ]]; then
            card_review_id="$(node scripts/atlas-review-block.js select-card-review "${reviews_file}" "${current_head}")"
          fi

          card_outcome=""
          if [[ -n "${card_review_id}" ]]; then
            live_pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            live_head="$(jq -r '.head.sha' <<<"${live_pr_json}")"
            card_review_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews/${card_review_id}")"
            jq -n \
              --argjson pr "${live_pr_json}" \
              --argjson review "${card_review_json}" \
              '{
                source: "pull_request_review",
                reviewerLogin: $review.user.login,
                reviewedSha: $review.commit_id,
                currentHeadSha: $pr.head.sha,
                reviewBody: ($review.body // ""),
                pr: {
                  number: $pr.number,
                  state: $pr.state,
                  base: { ref: $pr.base.ref },
                  head: { sha: $pr.head.sha, ref: $pr.head.ref }
                }
              }' > "${RUNNER_TEMP}/card-request.json"
            set +e
            node scripts/atlas-review-block.js evaluate-review "${RUNNER_TEMP}/card-request.json" \
              > "${RUNNER_TEMP}/card-eval.json"
            card_status=$?
            set -e
            if [[ "${card_status}" -eq 0 ]]; then
              if [[ "${live_head}" != "$(jq -r '.head.sha' <<<"${pr_json}")" ]]; then
                echo "Live PR head moved before the review-block patch. Fail closed."
                echo "eligible=false" >> "${GITHUB_OUTPUT}"
                echo "card_outcome=" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              jq -r '.body // ""' <<<"${live_pr_json}" > "${RUNNER_TEMP}/pr-body.md"
              jq '.fields' "${RUNNER_TEMP}/card-eval.json" > "${RUNNER_TEMP}/card-fields.json"
              set +e
              node scripts/atlas-review-block.js patch \
                "${RUNNER_TEMP}/pr-body.md" "${RUNNER_TEMP}/card-fields.json" \
                > "${RUNNER_TEMP}/pr-body-patched.md"
              patch_status=$?
              set -e
              if [[ "${patch_status}" -ne 0 ]]; then
                echo "Review block could not be patched deterministically. Fail closed without rewriting the body."
                exit 1
              fi
              jq -n --rawfile body "${RUNNER_TEMP}/pr-body-patched.md" '{body: $body}' \
                | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --input -
              card_outcome="$(jq -r '.outcome' "${RUNNER_TEMP}/card-eval.json")"
              echo "Synced Atlas review block to ${card_outcome} for ${live_head}."
            elif [[ "${card_status}" -ne 2 ]]; then
              echo "Review-block helper failed with status ${card_status}."
              exit 1
            fi
          fi
          echo "card_outcome=${card_outcome}" >> "${GITHUB_OUTPUT}"

          if [[ "${card_outcome}" == "PASS" ]]; then
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${current_head}" >> "${GITHUB_OUTPUT}"
            echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
            echo "reviewed_sha=$(jq -r '.commit_id' <<<"${card_review_json}")" >> "${GITHUB_OUTPUT}"
            echo "review_id=${card_review_id}" >> "${GITHUB_OUTPUT}"
            echo "next_round=" >> "${GITHUB_OUTPUT}"
            echo "lane=" >> "${GITHUB_OUTPUT}"
            echo "Trusted Atlas PASS does not start a repair."

            live_after="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
            live_after_head="$(jq -r '.head.sha' <<<"${live_after}")"
            live_after_ref="$(jq -r '.head.ref' <<<"${live_after}")"
            live_after_state="$(jq -r '.state' <<<"${live_after}")"
            live_after_base="$(jq -r '.base.ref' <<<"${live_after}")"
            if [[ "${live_after_state}" != "open" || "${live_after_base}" != "main" ]]; then
              echo "Live PR is no longer an open PR targeting main after trusted PASS card sync. Fail closed without dispatching Merge Card check."
              exit 1
            fi
            if [[ "${live_after_head}" != "${live_head}" || "${live_after_ref}" != "${head_ref}" ]]; then
              echo "Live PR head moved after trusted PASS card sync. Fail closed without dispatching Merge Card check."
              exit 1
            fi
            gh workflow run merge-card-check.yml \
              --ref "${live_after_ref}" \
              --field "pr_number=${pr_number}" \
              --field "expected_head_sha=${live_after_head}"
            echo "Dispatched Merge Card check for PR ${pr_number} at ${live_after_head}."
            exit 0
          fi

          review_id="${DISPATCH_REVIEW}"
          if [[ -z "${review_id}" ]]; then
            review_id="$(node scripts/atlas-cursor-repair-gate.js select-review "${reviews_file}" "${current_head}")"
          fi

          if [[ -z "${review_id}" ]]; then
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            echo "No eligible Codex or Atlas review is on the current head."
            exit 0
          fi

          review_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews/${review_id}")"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews/${review_id}/comments" \
            --jq '.[]' > "${comments_file}.ndjson"
          jq -s '.' "${comments_file}.ndjson" > "${comments_file}"

          jq -n \
            --argjson pr "${pr_json}" \
            --argjson review "${review_json}" \
            --argjson comments "$(cat "${comments_file}")" \
            --rawfile state "${state_file}" \
            '{
              reviewerLogin: $review.user.login,
              reviewedSha: $review.commit_id,
              currentHeadSha: $pr.head.sha,
              reviewBody: ($review.body // ""),
              reviewComments: $comments,
              stateComments: ($state | split("\n")),
              pr: {
                number: $pr.number,
                state: $pr.state,
                base: { ref: $pr.base.ref },
                head: { sha: $pr.head.sha, ref: $pr.head.ref }
              }
            }' > "${RUNNER_TEMP}/repair-request.json"

          set +e
          node scripts/atlas-cursor-repair-gate.js evaluate "${RUNNER_TEMP}/repair-request.json" \
            > "${RUNNER_TEMP}/repair-result.json"
          status=$?
          set -e

          eligible=false
          if [[ "${status}" -eq 0 ]]; then
            eligible=true
          elif [[ "${status}" -ne 2 ]]; then
            echo "Gate script failed with status ${status}."
            exit 1
          fi

          next_round="$(jq -r '.nextRound // empty' "${RUNNER_TEMP}/repair-result.json")"
          lane="$(jq -r '.lane // empty' "${RUNNER_TEMP}/repair-result.json")"
          echo "eligible=${eligible}" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${current_head}" >> "${GITHUB_OUTPUT}"
          echo "head_ref=${head_ref}" >> "${GITHUB_OUTPUT}"
          echo "reviewed_sha=$(jq -r '.commit_id' <<<"${review_json}")" >> "${GITHUB_OUTPUT}"
          echo "review_id=${review_id}" >> "${GITHUB_OUTPUT}"
          echo "next_round=${next_round}" >> "${GITHUB_OUTPUT}"
          echo "lane=${lane}" >> "${GITHUB_OUTPUT}"
          jq -r '.reason' "${RUNNER_TEMP}/repair-result.json"

          node scripts/atlas-cursor-repair-gate.js prompt "${RUNNER_TEMP}/repair-request.json" \
            > "${RUNNER_TEMP}/repair-prompt.txt"

      - name: Upload gate artifacts
        if: steps.evaluate.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-cursor-repair-gate
          path: |
            ${{ runner.temp }}/repair-request.json
            ${{ runner.temp }}/repair-result.json
            ${{ runner.temp }}/repair-prompt.txt

  repair:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.cursor.outputs.changed }}
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ATLAS_CURSOR_MODEL: ${{ vars.ATLAS_CURSOR_MODEL }}
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Checkout the gated reviewed SHA for file edits
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: pr-worktree

      - name: Confirm the edit worktree is still the gated SHA
        run: |
          set -euo pipefail
          actual="$(git -C pr-worktree rev-parse HEAD)"
          node trusted/scripts/atlas-cursor-repair-gate.js assert-head \
            "${{ needs.gate.outputs.head_sha }}" \
            "${actual}" \
            "${{ needs.gate.outputs.reviewed_sha }}"

      - name: Download the repair prompt
        uses: actions/download-artifact@v4
        with:
          name: atlas-cursor-repair-gate
          path: ${{ runner.temp }}/gate

      - name: Install Cursor CLI and prove the configured model
        run: |
          set -euo pipefail
          if [[ -z "${ATLAS_CURSOR_MODEL}" ]]; then
            echo "Repository variable ATLAS_CURSOR_MODEL is unset. Fail closed."
            exit 1
          fi
          curl -fsS https://cursor.com/install | bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/bin:${PATH}"
          models="$(mktemp "${RUNNER_TEMP:-/tmp}/atlas-cursor-models.XXXXXX")"
          cursor-agent --list-models > "${models}"
          if ! grep -F -- "${ATLAS_CURSOR_MODEL}" "${models}" >/dev/null; then
            echo "ATLAS_CURSOR_MODEL is not in the Cursor CLI model list. Fail closed."
            exit 1
          fi

      - name: Run cursor-agent on files only
        id: cursor
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"

          sandbox="$(mktemp -d "${RUNNER_TEMP:-/tmp}/atlas-cursor-bin.XXXXXX")"
          real_git="$(command -v git)"
          install -m 0755 trusted/scripts/atlas-cursor-repair-deny-git.sh "${sandbox}/git"
          install -m 0755 trusted/scripts/atlas-cursor-repair-deny-gh.sh "${sandbox}/gh"
          export ATLAS_REAL_GIT="${real_git}"

          env -u GITHUB_TOKEN -u GH_TOKEN -u ATLAS_AUTOMATION_TOKEN \
            PATH="${sandbox}:${HOME}/.local/bin:/usr/bin:/bin" \
            CURSOR_API_KEY="${CURSOR_API_KEY}" \
            ATLAS_REAL_GIT="${real_git}" \
            cursor-agent --print --trust --force \
              --workspace "${GITHUB_WORKSPACE}/pr-worktree" \
              --model "${ATLAS_CURSOR_MODEL}" \
              --output-format text \
              "$(cat "${RUNNER_TEMP}/gate/repair-prompt.txt")"

          git -C pr-worktree add -A
          git -C pr-worktree diff --cached --binary > "${RUNNER_TEMP}/repair.patch"
          if [[ ! -s "${RUNNER_TEMP}/repair.patch" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Cursor produced no file changes."
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Upload the file-only repair patch
        if: steps.cursor.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-cursor-repair-patch
          path: ${{ runner.temp }}/repair.patch

  test:
    needs: [gate, repair]
    if: needs.repair.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the gated reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false

      - name: Confirm the test worktree is still the gated SHA
        env:
          GATED_SHA: ${{ needs.gate.outputs.head_sha }}
          REVIEWED_SHA: ${{ needs.gate.outputs.reviewed_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${GATED_SHA}" || "${actual}" != "${REVIEWED_SHA}" ]]; then
            echo "Test worktree ${actual} is not gated/reviewed SHA ${GATED_SHA}."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download the repair patch
        uses: actions/download-artifact@v4
        with:
          name: atlas-cursor-repair-patch
          path: ${{ runner.temp }}/patch

      - name: Apply the patch and run the correctness suite
        run: |
          set -euo pipefail
          git apply "${RUNNER_TEMP}/patch/repair.patch"
          npm test

  push:
    needs: [gate, repair, test]
    if: needs.repair.outputs.changed == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Preserve trusted gate script outside the PR worktree
        run: |
          set -euo pipefail
          install -D -m 0644 trusted/scripts/atlas-cursor-repair-gate.js \
            "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-cursor-repair-gate.js"
          install -D -m 0644 trusted/scripts/atlas-review-block.js \
            "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-review-block.js"
          install -D -m 0644 trusted/scripts/atlas-github-pr-head-sync.js \
            "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-github-pr-head-sync.js"
          test -s "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-cursor-repair-gate.js"
          test -s "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-review-block.js"
          test -s "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-github-pr-head-sync.js"

      - name: Checkout the PR branch with the automation credential
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_ref }}
          token: ${{ secrets.ATLAS_AUTOMATION_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: pr-worktree

      - name: Download the repair patch
        uses: actions/download-artifact@v4
        with:
          name: atlas-cursor-repair-patch
          path: ${{ runner.temp }}/patch

      - name: Commit, push, and persist the round
        working-directory: pr-worktree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
          HEAD_REF: ${{ needs.gate.outputs.head_ref }}
          GATED_SHA: ${{ needs.gate.outputs.head_sha }}
          REVIEWED_SHA: ${{ needs.gate.outputs.reviewed_sha }}
          REVIEW_ID: ${{ needs.gate.outputs.review_id }}
          NEXT_ROUND: ${{ needs.gate.outputs.next_round }}
          LANE: ${{ needs.gate.outputs.lane }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          local_head="$(git rev-parse HEAD)"
          node "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-cursor-repair-gate.js" assert-head \
            "${GATED_SHA}" "${local_head}" "${live}"
          node "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-cursor-repair-gate.js" assert-head \
            "${REVIEWED_SHA}" "${local_head}" "${live}"
          git apply "${RUNNER_TEMP}/patch/repair.patch"
          git add -A
          git config core.hooksPath .githooks
          git config user.name atlas-automation
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          lane_label="Codex"
          if [[ "${LANE}" == "atlas" ]]; then
            lane_label="Atlas"
          fi
          git commit -m "Apply ${lane_label} review repair for ${REVIEWED_SHA} (round ${NEXT_ROUND})."
          git push
          repair_sha="$(git rev-parse HEAD)"
          jq -n \
            --arg expectedSha "${repair_sha}" \
            --arg previousSha "${GATED_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --argjson prNumber "${PR_NUMBER}" \
            --arg headRef "${HEAD_REF}" \
            --arg baseRef "main" \
            '{
              expectedSha: $expectedSha,
              previousSha: $previousSha,
              identity: {
                repository: $repository,
                prNumber: $prNumber,
                headRef: $headRef,
                baseRef: $baseRef
              }
            }' > "${RUNNER_TEMP}/head-sync-request.json"
          set +e
          node "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-github-pr-head-sync.js" confirm \
            "${RUNNER_TEMP}/head-sync-request.json" \
            > "${RUNNER_TEMP}/live-pr.json"
          sync_status=$?
          set -e
          if [[ "${sync_status}" -ne 0 ]]; then
            echo "Live PR head did not converge to the pushed repair SHA ${repair_sha}. Fail closed without rewriting the review block."
            exit 1
          fi
          live_head="$(jq -r '.head.sha' "${RUNNER_TEMP}/live-pr.json")"
          if [[ "${live_head}" != "${repair_sha}" ]]; then
            echo "Live PR head ${live_head} is not the pushed repair SHA ${repair_sha}. Fail closed without rewriting the review block."
            exit 1
          fi
          jq -r '.body // ""' "${RUNNER_TEMP}/live-pr.json" > "${RUNNER_TEMP}/pr-body.md"
          jq --arg newHead "${repair_sha}" --rawfile body "${RUNNER_TEMP}/pr-body.md" '{
              newHeadSha: $newHead,
              body: $body,
              pr: {
                number: .number,
                state: .state,
                base: { ref: .base.ref },
                head: { sha: .head.sha, ref: .head.ref }
              }
            }' "${RUNNER_TEMP}/live-pr.json" > "${RUNNER_TEMP}/pending-request.json"
          set +e
          node "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-review-block.js" evaluate-pending \
            "${RUNNER_TEMP}/pending-request.json" \
            > "${RUNNER_TEMP}/pending-eval.json"
          pending_status=$?
          set -e
          if [[ "${pending_status}" -eq 0 ]]; then
            jq '.fields' "${RUNNER_TEMP}/pending-eval.json" > "${RUNNER_TEMP}/pending-fields.json"
            set +e
            node "${RUNNER_TEMP}/atlas-trusted-scripts/atlas-review-block.js" patch \
              "${RUNNER_TEMP}/pr-body.md" "${RUNNER_TEMP}/pending-fields.json" \
              > "${RUNNER_TEMP}/pr-body-patched.md"
            pending_patch=$?
            set -e
            if [[ "${pending_patch}" -ne 0 ]]; then
              echo "Review block could not be moved to PENDING deterministically. Fail closed without rewriting the body."
              exit 1
            fi
            jq -n --rawfile body "${RUNNER_TEMP}/pr-body-patched.md" '{body: $body}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --input -
            echo "Synced Atlas review block to PENDING for ${repair_sha}."
          elif [[ "${pending_status}" -eq 2 ]]; then
            jq -r '.reason' "${RUNNER_TEMP}/pending-eval.json"
          else
            echo "Pending review-block helper failed with status ${pending_status}."
            exit 1
          fi

          marker='<!-- atlas-cursor-repair-state -->'
          comments="$(mktemp "${RUNNER_TEMP:-/tmp}/atlas-repair-comments.XXXXXX")"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[]' > "${comments}.ndjson"
          jq -s '.' "${comments}.ndjson" > "${comments}"
          existing="$(jq -r --arg marker "${marker}" '
            [.[] | select(.body != null and (.body | contains($marker)))]
            | last
            | .id // empty
          ' "${comments}")"

          body="$(printf '%s\n%s\n\nAutomated Cursor repair round %s for reviewed head `%s`. Pushed `%s`.\n' \
            "${marker}" \
            "$(jq -nc --arg rounds "${NEXT_ROUND}" --arg reviewed "${REVIEWED_SHA}" \
              --arg repair "${repair_sha}" --arg review "${REVIEW_ID}" \
              '{rounds:($rounds|tonumber),last_reviewed_sha:$reviewed,last_repair_sha:$repair,review_id:$review}')" \
            "${NEXT_ROUND}" "${REVIEWED_SHA}" "${repair_sha}")"

          if [[ -n "${existing}" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --method PATCH \
              -f body="${body}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --method POST \
              -f body="${body}"
          fi
