# Atlas CI — the one GitHub-hosted check.
#
# TRUST MODEL: pull_request_target uses this file from the default branch.
# A pull request that edits, deletes, or no-ops this YAML cannot change the
# gate that judges it. GitHub Pro status-check / branch-protection rules
# cannot pin the workflow *definition* on a personal repository — "require
# workflows" is organisation/enterprise-only, and a pull_request trigger
# would execute PR-authored YAML. This is the smallest pattern that actually
# closes that hole.
#
# The trusted definition is recursive: ordinary PRs cannot change this file
# *or* scripts/atlas-ci-gate.js. The default-branch helper compares both
# byte-for-byte with the trusted copies. Owner bypass is the upgrade path.
#
# Two jobs on separate runners. The suite tests the exact live PR head with
# credentials disabled and GITHUB_TOKEN unset. The publisher is the only
# job allowed to write commit statuses; it checks nothing out, executes no
# PR code, and consumes only the trusted event/API head plus the suite
# job result.
#
# No OpenAI API. No repair or review orchestration.
name: Atlas CI

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atlas-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Atlas CI suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: none
    steps:
      - name: Identify the exact live PR head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_FORK: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_FORK}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Fork pull requests are refused. Fail closed."
            exit 1
          fi
          if [[ ! "${EVENT_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Event did not identify the pull request. Fail closed."
            exit 1
          fi
          if [[ ! "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Event did not identify a 40-character head SHA. Fail closed."
            exit 1
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EVENT_NUMBER}")"
          live_number="$(jq -r '.number' <<<"${pr}")"
          live_state="$(jq -r '.state' <<<"${pr}")"
          live_merged="$(jq -r '.merged' <<<"${pr}")"
          live_base="$(jq -r '.base.ref' <<<"${pr}")"
          live_head="$(jq -r '.head.sha' <<<"${pr}")"
          live_repo="$(jq -r '.head.repo.full_name' <<<"${pr}")"
          if [[ "${live_number}" != "${EVENT_NUMBER}" ]]; then
            echo "Live PR ${live_number} is not event PR ${EVENT_NUMBER}. Fail closed."
            exit 1
          fi
          if [[ "${live_state}" != "open" || "${live_merged}" == "true" ]]; then
            echo "Pull request is not open. Fail closed."
            exit 1
          fi
          if [[ "${live_base}" != "main" ]]; then
            echo "Pull request base is ${live_base:-missing}, not main. Fail closed."
            exit 1
          fi
          if [[ "${live_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Live head repository ${live_repo:-missing} is not ${GITHUB_REPOSITORY}. Fail closed."
            exit 1
          fi
          if [[ ! "${live_head}" =~ ^[0-9a-f]{40}$ || "${live_head}" != "${EVENT_HEAD}" ]]; then
            echo "Live head ${live_head:0:7} is not the event head ${EVENT_HEAD:0:7}. Fail closed."
            exit 1
          fi
          echo "sha=${live_head}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted default-branch copy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Checkout the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
          path: pr

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Default-branch helper, PR tree as data. Does not execute PR YAML.
      - name: Refuse a mutated trusted gate
        run: node trusted/scripts/atlas-ci-gate.js evaluate-pr pr trusted

      - name: Run the correctness suite
        working-directory: pr
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: npm test

      # Each revision runs its own snapshot script. The compare helper is the
      # trusted default-branch copy so a PR cannot lie about the diff.
      - name: Snapshot and compare published figures
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: |
          set -euo pipefail
          ( cd pr && node scripts/figures-snapshot.js ) > "$RUNNER_TEMP/head.json"
          ( cd trusted && node scripts/figures-snapshot.js ) > "$RUNNER_TEMP/base.json"
          node trusted/scripts/figures-compare.js \
            "$RUNNER_TEMP/base.json" \
            "$RUNNER_TEMP/head.json" \
            --base-ref="${{ github.event.pull_request.base.ref }}" \
            > "$GITHUB_STEP_SUMMARY"

  publish:
    name: Atlas CI
    needs: test
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish Atlas CI on the exact live head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_FORK: ${{ github.event.pull_request.head.repo.full_name }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_FORK}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Fork pull requests are refused. Fail closed."
            exit 1
          fi
          if [[ ! "${EVENT_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Event did not identify the pull request. Fail closed."
            exit 1
          fi
          if [[ ! "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Event did not identify a 40-character head SHA. Fail closed."
            exit 1
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EVENT_NUMBER}")"
          live_number="$(jq -r '.number' <<<"${pr}")"
          live_state="$(jq -r '.state' <<<"${pr}")"
          live_merged="$(jq -r '.merged' <<<"${pr}")"
          live_base="$(jq -r '.base.ref' <<<"${pr}")"
          live_head="$(jq -r '.head.sha' <<<"${pr}")"
          live_repo="$(jq -r '.head.repo.full_name' <<<"${pr}")"
          if [[ "${live_number}" != "${EVENT_NUMBER}" ]]; then
            echo "Live PR ${live_number} is not event PR ${EVENT_NUMBER}. Fail closed."
            exit 1
          fi
          if [[ "${live_state}" != "open" || "${live_merged}" == "true" ]]; then
            echo "Pull request is not open. Fail closed."
            exit 1
          fi
          if [[ "${live_base}" != "main" ]]; then
            echo "Pull request base is ${live_base:-missing}, not main. Fail closed."
            exit 1
          fi
          if [[ "${live_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "Live head repository ${live_repo:-missing} is not ${GITHUB_REPOSITORY}. Fail closed."
            exit 1
          fi
          if [[ ! "${live_head}" =~ ^[0-9a-f]{40}$ || "${live_head}" != "${EVENT_HEAD}" ]]; then
            echo "Live head ${live_head:0:7} is not the event head ${EVENT_HEAD:0:7}. Fail closed."
            exit 1
          fi
          state="failure"
          description="Atlas CI failed on this exact head."
          if [[ "${TEST_RESULT}" == "success" ]]; then
            state="success"
            description="Trusted default-branch Atlas CI passed on this exact head."
          fi
          jq -n \
            --arg state "${state}" \
            --arg desc "${description:0:140}" \
            --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state, context:"Atlas CI", description:$desc, target_url:$url}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${live_head}" --input - >/dev/null
          if [[ "${state}" != "success" ]]; then
            exit 1
          fi
