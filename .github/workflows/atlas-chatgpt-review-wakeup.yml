name: Atlas ChatGPT review wake-up

# Secret-free, default-branch-controlled wake-up. It posts a marker only after
# the live PR is an eligible, green merge candidate. ChatGPT Work watches for
# that marker through its connected GitHub event-triggered task.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows:
      - tests
      - Merge card check
      - Published figures review
      - Risk label gate
      - Incumbent privacy guard
      - Auto-label by path
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
  statuses: read

# Do not use workflow-level concurrency. GitHub keeps one running and one
# pending run per group; a later unrelated gate or a pull_request_target
# completion with no associated PR can replace an eligible pending wake-up
# and leave a green REQUIRED head un-woken. Resolve PR identity first, then
# serialize only that PR's wake-up. A PR-less event fans out to nothing.
jobs:
  resolve:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs: ${{ steps.prs.outputs.prs }}
    steps:
      - name: Checkout trusted default-branch helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve wake-up PR identities
        id: prs
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts/atlas-chatgpt-review-wakeup.js');
            if (!fs.existsSync(helperPath)) {
              core.notice('Trusted wake-up helper is not on default main yet; bootstrap PR is intentionally skipped.');
              core.setOutput('prs', '[]');
              return;
            }
            const gate = require(helperPath);
            const { owner, repo } = context.repo;
            let associatedPullRequestNumbers = [];
            if (context.eventName !== 'pull_request') {
              const fromEvent = (context.payload.workflow_run.pull_requests || [])
                .map((pr) => Number(pr.number));
              if (!fromEvent.length) {
                const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: context.payload.workflow_run.head_sha,
                  per_page: 20,
                });
                associatedPullRequestNumbers = (response.data || [])
                  .map((pr) => Number(pr.number));
              }
            }
            const prNumbers = gate.resolveWakeupPrNumbers({
              eventName: context.eventName,
              pullRequestNumber: context.eventName === 'pull_request'
                ? context.payload.pull_request.number
                : undefined,
              workflowRunPullRequestNumbers: context.eventName === 'workflow_run'
                ? (context.payload.workflow_run.pull_requests || []).map((pr) => pr.number)
                : undefined,
              associatedPullRequestNumbers,
            });
            core.info(`resolved PR identities: ${prNumbers.join(', ') || '(none)'}`);
            core.setOutput('prs', JSON.stringify(prNumbers));

  wake:
    needs: resolve
    if: needs.resolve.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.resolve.outputs.prs) }}
    concurrency:
      group: atlas-chatgpt-review-wakeup-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default-branch helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Post one exact-head ChatGPT Work wake-up
        uses: actions/github-script@v7
        env:
          WAKE_PR_NUMBER: ${{ matrix.pr }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const helperPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts/atlas-chatgpt-review-wakeup.js');
            if (!fs.existsSync(helperPath)) {
              core.notice('Trusted wake-up helper is not on default main yet; bootstrap PR is intentionally skipped.');
              return;
            }
            const gate = require(helperPath);
            const { owner, repo } = context.repo;
            const number = Number(process.env.WAKE_PR_NUMBER);
            if (!Number.isInteger(number) || number <= 0) {
              core.notice('Wake-up matrix PR identity is not a positive integer.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (!pr || pr.state !== 'open' || pr.base.ref !== 'main' || pr.draft === true) {
              core.info(`#${number}: skipped — not an open non-draft main PR.`);
              return;
            }

            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
              owner,
              repo,
              ref: pr.head.sha,
              per_page: 100,
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });

            const decision = gate.decide({
              pr,
              checks,
              statuses,
              reviews,
              comments,
            });
            core.info(`#${number}: ${decision.code} — ${decision.reason}`);
            if (!decision.ok) return;

            const body = gate.formatWakeComment(pr.head.sha, gate.generateWakeId());
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body,
            });
            core.info(`#${number}: posted exact-head ChatGPT Work wake-up for ${pr.head.sha}`);
