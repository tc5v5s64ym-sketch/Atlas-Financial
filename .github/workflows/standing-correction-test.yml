# Synthetic standing-contract proof. No provider credentials or deployment.
name: Bounded standing correction tests
on:
  push:
    branches: [main, agent/bounded-standing-lunchmoney-corrections]
    paths:
      - 'scripts/assistant-*.js'
      - 'test/test-assistant-*.js'
      - '.github/workflows/standing-correction-test.yml'
  pull_request:
    paths:
      - 'scripts/assistant-*.js'
      - 'test/test-assistant-*.js'
      - '.github/workflows/standing-correction-test.yml'
permissions:
  contents: read
jobs:
  standing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime dependencies
        run: npm ci --omit=dev
      - name: Prove bounded synthetic standing contract
        run: node test/test-assistant-standing-corrections.js
      - name: Prove actual durable authority and two-process category execution
        run: node test/test-assistant-standing-store.js
      - name: Prove incumbent interactive contract
        run: node test/test-assistant-lunchmoney.js
      - name: Prove incumbent HTTP and JWT boundary
        run: node test/test-assistant-interface.js
