name: Risk label gate

# The Merge Card "Primary risk" row is the authority. This gate projects that
# closed value onto the GitHub primary-risk label, then requires the live
# label to equal the card. Category labels stay path-derived and non-blocking.
#
# The gate publishes a commit status named `risk-label/primary` on the PR HEAD
# SHA via the API, rather than relying on the job conclusion — under
# `pull_request_target` the job's own GITHUB_SHA is the default-branch commit,
# so a job-conclusion check would not attach to the head that branch
# protection evaluates.
#
# FAIL-CLOSED, NEVER-STALE:
#   · the head is marked `pending` on every trigger, so a prior green cannot
#     survive into a run that has not yet evaluated it;
#   · an EXIT trap publishes failure if the shell aborts after pending, so a
#     helper or API error cannot leave the required check stranded pending;
#   · the live Merge Card is re-fetched and revalidated before success, so a
#     card edit queued behind this run cannot be published as the stale body;
#   · per-PR concurrency serialises runs so a newer label or card edit
#     publishes last. cancel-in-progress is FALSE on purpose — cancelling a
#     superseded run would still fire its publisher and could overwrite a
#     newer result.
#
# TRUST MODEL: `pull_request_target` runs the workflow definition from the
# default branch, so a PR editing this file cannot make the gate evaluate its
# own unreviewed logic. It checks out that default-branch helper only, with
# credentials disabled, and treats the live PR body and label names as data.
# It never executes PR-head code. Label writes are the only mutation.
#
# To make it binding, add `risk-label/primary` to the required status checks on
# `main` in branch protection. That is an owner action and is deliberately not
# automated.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  statuses: write
  contents: read
  pull-requests: write

concurrency:
  group: risk-label-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  primary-risk-label:
    name: Exactly one primary risk label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark the exact head pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'risk-label/primary',
              description: 'Checking Merge Card Primary risk against the GitHub label…',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout trusted default-branch helper
        if: always()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sync label from Merge Card and publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          sha="${EVENT_HEAD}"
          state="failure"
          description="Gate errored — treated as failure."
          published=0

          post_status() {
            jq -n \
              --arg state "${state}" \
              --arg desc "${description:0:140}" \
              --arg url "${target_url}" \
              '{state:$state, context:"risk-label/primary", description:$desc, target_url:$url}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" --input - >/dev/null
          }

          publish() {
            post_status
            published=1
            if [[ "${state}" != "success" ]]; then
              echo "${description}"
              exit 1
            fi
          }

          on_exit() {
            if [[ "${published}" -ne 1 ]]; then
              state="failure"
              description="Gate errored — treated as failure."
              echo "${description}"
              post_status || true
              published=1
            fi
          }
          trap on_exit EXIT

          load_live_card() {
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${EVENT_NUMBER}")"
            live_number="$(jq -r '.number' <<<"${pr_json}")"
            live_repo="$(jq -r '.base.repo.full_name // empty' <<<"${pr_json}")"
            live_state="$(jq -r '.state' <<<"${pr_json}")"
            live_merged="$(jq -r '.merged' <<<"${pr_json}")"
            live_base="$(jq -r '.base.ref // empty' <<<"${pr_json}")"
            live_head="$(jq -r '.head.sha // empty' <<<"${pr_json}")"
            sha="${live_head}"

            if [[ "${live_number}" != "${EVENT_NUMBER}" ]]; then
              description="Gate errored (live PR ${live_number} is not event PR ${EVENT_NUMBER}) — treated as failure."
              publish
            fi
            if [[ "${live_repo}" != "${GITHUB_REPOSITORY}" ]]; then
              description="Gate errored (live repository ${live_repo:-missing} is not ${GITHUB_REPOSITORY}) — treated as failure."
              publish
            fi
            if [[ "${live_state}" != "open" || "${live_merged}" == "true" ]]; then
              description="Gate errored (pull request is not open) — treated as failure."
              publish
            fi
            if [[ "${live_base}" != "main" ]]; then
              description="Gate errored (pull request base is ${live_base:-missing}, not main) — treated as failure."
              publish
            fi
            if [[ ! "${live_head}" =~ ^[0-9a-f]{40}$ || "${live_head}" != "${EVENT_HEAD}" ]]; then
              description="Gate errored (live head ${live_head:0:7} is not the event head ${EVENT_HEAD:0:7}) — treated as failure."
              publish
            fi

            jq -r '.body // ""' <<<"${pr_json}" > "${RUNNER_TEMP}/pr-body.md"
            labels_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${EVENT_NUMBER}/labels" \
              --jq '.[].name' | jq -R -s -c 'split("\n") | map(select(length > 0))')"
            jq -n --rawfile body "${RUNNER_TEMP}/pr-body.md" --argjson labels "${labels_json}" \
              '{body:$body, labels:$labels}' > "${RUNNER_TEMP}/risk-request.json"
          }

          apply_card_labels() {
            node scripts/atlas-primary-risk.js evaluate "${RUNNER_TEMP}/risk-request.json" \
              > "${RUNNER_TEMP}/risk-plan.json"
            mapfile -t add_labels < <(jq -r '.add // [] | .[]' "${RUNNER_TEMP}/risk-plan.json")
            mapfile -t remove_labels < <(jq -r '.remove // [] | .[]' "${RUNNER_TEMP}/risk-plan.json")
            if ((${#add_labels[@]})); then
              jq -n --argjson labels "$(jq -c '.add' "${RUNNER_TEMP}/risk-plan.json")" '{labels:$labels}' \
                | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${EVENT_NUMBER}/labels" --input - >/dev/null
            fi
            if ((${#remove_labels[@]})); then
              for name in "${remove_labels[@]}"; do
                encoded="$(jq -rn --arg name "${name}" '$name | @uri')"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${EVENT_NUMBER}/labels/${encoded}" >/dev/null
              done
            fi
            if ((${#add_labels[@]})) || ((${#remove_labels[@]})); then
              labels_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${EVENT_NUMBER}/labels" \
                --jq '.[].name' | jq -R -s -c 'split("\n") | map(select(length > 0))')"
              jq -n --rawfile body "${RUNNER_TEMP}/pr-body.md" --argjson labels "${labels_json}" \
                '{body:$body, labels:$labels}' > "${RUNNER_TEMP}/risk-request.json"
            fi
          }

          if [[ ! "${EVENT_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            description="Gate errored (event did not identify the pull request) — treated as failure."
            publish
          fi
          if [[ ! "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
            description="Gate errored (event did not identify a 40-character head SHA) — treated as failure."
            publish
          fi

          load_live_card
          apply_card_labels
          # A card edit during this run is queued behind concurrency and cannot
          # mark pending until we finish. Re-read the live card, re-project it,
          # then snapshot again before the gate so success cannot be published
          # from the body captured at start.
          load_live_card
          apply_card_labels
          load_live_card

          set +e
          node scripts/atlas-primary-risk.js evaluate-gate "${RUNNER_TEMP}/risk-request.json" \
            > "${RUNNER_TEMP}/risk-gate.json"
          gate_status=$?
          set -e
          if [[ "${gate_status}" -eq 1 ]]; then
            description="Gate errored (helper failed) — treated as failure."
            publish
          fi
          state="$(jq -r '.state // "failure"' "${RUNNER_TEMP}/risk-gate.json")"
          description="$(jq -r '.description // "Gate errored — treated as failure."' "${RUNNER_TEMP}/risk-gate.json")"
          publish
