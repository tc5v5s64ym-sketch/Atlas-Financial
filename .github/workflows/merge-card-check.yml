name: Merge card check

# Mechanical merge-card validation only. This check verifies required fields,
# closed-form decisions, and the exact reviewed head. It does not interpret
# prose, findings, scope arguments, negation, or review quality.
#
# The workflow event identifies the PR, repository, and head being validated.
# Card text is always read from the live pull request via pulls.get. A rerun
# therefore cannot re-validate a stale event body after the live card changed.
#
# pull_request remains the ordinary path, including human card edits. Trusted
# Atlas PASS card-sync uses GITHUB_TOKEN, which GitHub does not chain into a
# pull_request edited run. That automation path starts this same workflow via
# workflow_dispatch, with the PR number and expected head SHA. The dispatcher
# targets the PR head branch when that commit already has this trigger, so the
# required check lands on that SHA. A PR head created before this trigger
# reached main cannot be targeted (`gh workflow run --ref` uses the workflow
# version at that ref). Those runs use the default-branch workflow version, and
# this job records the required check on the expected PR head. The job name is
# the required-check identity and must stay put.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose live merge card must be validated
        required: true
        type: number
      expected_head_sha:
        description: Exact PR head SHA that must still be live
        required: true
        type: string

permissions:
  pull-requests: read
  checks: write

jobs:
  check:
    name: Merge card mechanical fields
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate mechanical merge-card facts
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName || '';
            const eventPr = context.payload.pull_request || {};
            const dispatchInputs = context.payload.inputs || {};
            const { owner, repo } = context.repo;
            const problems = [];
            const REQUIRED_CHECK_NAME = 'Merge card mechanical fields';
            const runSha = String(context.sha || '');
            let eventNumber;
            let eventHead;
            let reportRequiredCheckOnExpectedHead = false;

            if (!owner || !repo) {
              core.setFailed('Merge-card check failed closed: the event does not identify the repository.');
              return;
            }

            if (eventName === 'workflow_dispatch') {
              eventNumber = Number(dispatchInputs.pr_number);
              eventHead = String(dispatchInputs.expected_head_sha || '').replace(/\s+/g, '');
              if (!/^[0-9a-f]{40}$/i.test(eventHead)) {
                core.setFailed('Merge-card check failed closed: workflow_dispatch did not identify a 40-character expected head SHA.');
                return;
              }
              if (!/^[0-9a-f]{40}$/i.test(runSha) || runSha.toLowerCase() !== eventHead.toLowerCase()) {
                const defaultBranch = String(((context.payload.repository || {}).default_branch) || '');
                const runRefName = String(context.ref || '').replace(/^refs\/heads\//, '');
                if (!defaultBranch || runRefName !== defaultBranch) {
                  core.setFailed(
                    `Merge-card check failed closed: workflow run SHA ${runSha.slice(0, 7) || '(missing)'} is not the expected head ${eventHead.slice(0, 7)}.`
                  );
                  return;
                }
                reportRequiredCheckOnExpectedHead = true;
              }
            } else if (eventName === 'pull_request') {
              eventNumber = Number(eventPr.number);
              eventHead = ((eventPr.head || {}).sha) || '';
            } else {
              core.setFailed(
                `Merge-card check failed closed: unsupported event ${eventName || '(missing)'}.`
              );
              return;
            }

            if (!Number.isInteger(eventNumber) || eventNumber <= 0) {
              core.setFailed('Merge-card check failed closed: the event does not identify the pull request.');
              return;
            }
            if (!/^[0-9a-f]{40}$/i.test(eventHead)) {
              core.setFailed('Merge-card check failed closed: the event does not identify a 40-character head SHA.');
              return;
            }

            let livePr;
            try {
              const liveResponse = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: eventNumber,
              });
              livePr = liveResponse && liveResponse.data;
            } catch (error) {
              const detail = error && error.message ? ` (${error.message})` : '.';
              core.setFailed(`Merge-card check failed closed: live pull request fetch failed${detail}`);
              return;
            }
            if (!livePr || typeof livePr !== 'object') {
              core.setFailed('Merge-card check failed closed: live pull request snapshot is missing.');
              return;
            }

            const liveNumber = Number(livePr.number);
            const liveRepo = ((((livePr.base || {}).repo) || {}).full_name) || '';
            const expectedRepo = `${owner}/${repo}`;
            const liveState = livePr.state;
            const liveBaseRef = ((livePr.base || {}).ref) || '';
            const liveHead = ((livePr.head || {}).sha) || '';

            if (!Number.isInteger(liveNumber) || liveNumber !== eventNumber) {
              core.setFailed(
                `Merge-card check failed closed: live PR ${liveNumber} is not event PR ${eventNumber}.`
              );
              return;
            }
            if (!liveRepo || liveRepo.toLowerCase() !== expectedRepo.toLowerCase()) {
              core.setFailed(
                `Merge-card check failed closed: live repository ${liveRepo || '(missing)'} is not ${expectedRepo}.`
              );
              return;
            }
            if (liveState !== 'open' || livePr.merged === true) {
              core.setFailed('Merge-card check failed closed: pull request is not open.');
              return;
            }
            if (liveBaseRef !== 'main') {
              core.setFailed(
                `Merge-card check failed closed: pull request base is ${liveBaseRef || '(missing)'}, not main.`
              );
              return;
            }
            if (!/^[0-9a-f]{40}$/i.test(liveHead) || liveHead.toLowerCase() !== eventHead.toLowerCase()) {
              core.setFailed(
                `Merge-card check failed closed: live head ${liveHead.slice(0, 7) || '(missing)'} is not the event head ${eventHead.slice(0, 7)}.`
              );
              return;
            }

            const body = livePr.body || '';
            const head = eventHead;
            const pull_number = eventNumber;

            // A small, closed path set is always high-risk in this repository.
            // File paths are mechanical facts. The list does not inspect prose or
            // try to infer risk from wording. Changes outside this set still use
            // the canonical human trigger decision in CLAUDE.md.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const ALWAYS_REVIEW = [
              /^(?:data|periods)\.json$/i,
              /^public\//i,
              /^server\.js$/i,
              /^(?:package|package-lock)\.json$/i,
              /^(?:ARCHITECTURE|CLAUDE|CONTEXT)\.md$/i,
              /^docs\/ACCOUNT_FACTS\.md$/i,
              /^\.github\/workflows\//i,
              /^\.githooks\//i,
              /^test-(?:static|forecast|budget|debt|invariants|authority-coverage|mergecard)\.js$/i,
              /^scripts\/(?:figures-snapshot|positions-summary)\.js$/i,
            ];
            const mechanicallyHighRisk = files
              .map((file) => file.filename.replace(/\\/g, '/'))
              .filter((filename) => ALWAYS_REVIEW.some((pattern) => pattern.test(filename)));

            const esc = (value) => value.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&');
            const sectionAfter = (heading) => body
              .slice(heading.index + heading[0].length)
              .split(/\n[ \t]*#{1,6}[ \t]+/)[0];
            const clean = (value) => value
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/\*\*/g, '')
              .trim();

            const cardHeading = /^[ \t]*#{1,4}[ \t]*.*Atlas Merge Card.*$/im.exec(body);
            if (!cardHeading) {
              problems.push('The PR body is missing the "Atlas Merge Card" heading.');
            }
            const cardSection = cardHeading ? sectionAfter(cardHeading) : '';
            const rowValue = (label) => {
              const pattern = esc(label);
              const table = new RegExp(
                `^[ \\t]*\\|[ \\t]*\\*{0,2}${pattern}\\*{0,2}[ \\t]*\\|([^\\n|]*)`, 'im'
              ).exec(cardSection);
              if (table) return clean(table[1]);
              const bullet = new RegExp(
                `^[ \\t]*[-*][ \\t]*\\*{0,2}${pattern}\\*{0,2}[ \\t]*:(.*)$`, 'im'
              ).exec(cardSection);
              return bullet ? clean(bullet[1]) : null;
            };

            const FIELDS = [
              'Title',
              'Primary risk',
              'Files / categories touched',
              'Current-state verdict',
              'Builder surface',
              'Primary builder model',
              'Supporting / explore models',
              'Architecture / dispatch authority',
              'Figures moved',
              'Reproduced / disproved',
              'Authority impact',
              'Tests',
              'Security',
              'Advisory review',
              'Owner decision required',
              'Estimated inputs added',
            ];

            for (const label of FIELDS) {
              const value = rowValue(label);
              if (value === null) {
                problems.push(`Merge card row "${label}" is missing.`);
              } else if (value === '') {
                problems.push(`Merge card row "${label}" is blank or still a template placeholder.`);
              }
            }

            const currentState = rowValue('Current-state verdict') || '';
            const CURRENT_STATE = [
              'STILL BROKEN',
              'ALREADY FIXED',
              'PARTIALLY FIXED',
              'FIXED BUT UNTESTED',
              'STALE-SUPERSEDED',
              'NEEDS OWNER ANSWER',
            ];
            if (currentState && !CURRENT_STATE.some(
              (value) => new RegExp(`^${esc(value)}(?:\\b|[ \\t]*[—–:.-])`, 'i').test(currentState)
            )) {
              problems.push(`"Current-state verdict" must open with one of: ${CURRENT_STATE.join(' / ')}.`);
            }

            const reviewHeading =
              /^[ \t]*#{2,4}[ \t]*Atlas Contract \/ Systems Review[ \t]*$/im.exec(body);
            if (!reviewHeading) {
              problems.push('The PR body is missing the "Atlas Contract / Systems Review" section.');
            } else {
              const section = sectionAfter(reviewHeading);
              const read = (label) => {
                const match = new RegExp(
                  `^[ \\t]*[-*][ \\t]*\\*{0,2}${esc(label)}\\*{0,2}[ \\t]*:(.*)$`, 'im'
                ).exec(section);
                return match ? clean(match[1]) : null;
              };
              const REVIEW_FIELDS = [
                'Required',
                'Exact reviewed head',
                'Reviewer',
                'Review outcome',
                'Findings and fix verification',
              ];
              const review = {};
              for (const label of REVIEW_FIELDS) {
                const value = read(label);
                review[label] = value || '';
                if (value === null) {
                  problems.push(`The review block is missing "${label}".`);
                } else if (value === '') {
                  problems.push(`Review block line "${label}" is blank or still a template placeholder.`);
                }
              }

              const required = /^REQUIRED(?:\b|[ \t]*[—–:.-])/i.test(review.Required);
              const notRequired = /^NOT[ \t]+REQUIRED(?:\b|[ \t]*[—–:.-])/i.test(review.Required);
              if (review.Required && !required && !notRequired) {
                problems.push('"Required" must open with REQUIRED or NOT REQUIRED.');
              }

              if (required) {
                const reviewedHead = review['Exact reviewed head'].replace(/[`\s]/g, '');
                if (!/^[0-9a-f]{40}$/i.test(reviewedHead)) {
                  problems.push('A required review must record one bare 40-character SHA.');
                } else if (head && reviewedHead.toLowerCase() !== head.toLowerCase()) {
                  problems.push(`The reviewed head ${reviewedHead.slice(0, 7)} is not the PR head ${head.slice(0, 7)}.`);
                }
                if (!/^ChatGPT$/i.test(review.Reviewer)) {
                  problems.push('A required Atlas Contract / Systems Review must record Reviewer: ChatGPT.');
                }
                if (!/^PASS$/i.test(review['Review outcome'])) {
                  problems.push('A required review must record Review outcome: PASS before merge.');
                }
              }

              if (notRequired) {
                if (mechanicallyHighRisk.length) {
                  problems.push(
                    'NOT REQUIRED is invalid because this PR changes mechanically high-risk path(s): ' +
                    mechanicallyHighRisk.join(', ') + '. Record the required exact-head review.'
                  );
                }
                for (const label of ['Exact reviewed head', 'Reviewer', 'Review outcome']) {
                  if (!/^N\/A$/i.test(review[label])) {
                    problems.push(`A NOT REQUIRED review must record ${label}: N/A.`);
                  }
                }
              }
            }

            if (reportRequiredCheckOnExpectedHead) {
              try {
                await github.rest.checks.create({
                  owner,
                  repo,
                  name: REQUIRED_CHECK_NAME,
                  head_sha: eventHead,
                  status: 'completed',
                  conclusion: problems.length ? 'failure' : 'success',
                  output: {
                    title: problems.length
                      ? `${problems.length} mechanical merge-card problem(s)`
                      : 'Merge card mechanical fields are complete',
                    summary: problems.length
                      ? `- ${problems.join('\n- ')}`
                      : 'Merge card mechanical fields are complete. Prose remains a reviewer judgement.',
                  },
                });
              } catch (error) {
                const detail = error && error.message ? ` (${error.message})` : '.';
                core.setFailed(`Merge-card check failed closed: could not record the required check on the expected head${detail}`);
                return;
              }
            }

            if (problems.length) {
              core.setFailed(`${problems.length} mechanical merge-card problem(s):\n- ${problems.join('\n- ')}`);
            } else {
              core.info('Merge card mechanical fields are complete. Prose remains a reviewer judgement.');
            }
