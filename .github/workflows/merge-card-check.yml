name: Merge card check

# Fails when a PR body is missing the Atlas Merge Card, or keeps a field's
# shipped placeholder instead of answering it.
#
# The check is LITERAL, never semantic. It can tell a claim from a blank; it
# cannot tell a true claim from a false one. That is the reviewer's job, and
# nothing here should be read as having verified a figure. What it does buy is
# that a change to a household's published numbers cannot merge while silent
# about what it moved.
#
# `none`, `no` and `n/a — <reason>` are real answers and pass. An empty row is
# silence, and silence is the thing this exists to fail.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: Merge card present and filled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the merge card
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request && context.payload.pull_request.body) || '';
            const problems = [];

            if (!/Atlas Merge Card/i.test(body)) {
              problems.push('The PR body is missing the "Atlas Merge Card" section. Start from .github/PULL_REQUEST_TEMPLATE.md.');
            }

            // Each field is satisfied when its row exists AND carries something
            // other than the shipped HTML comment. Matching the row by its bold
            // label keeps this working whether the body uses the table shape or
            // a bullet list, and prose that merely mentions the phrase is not a
            // row — the label has to be delimited.
            const FIELDS = [
              ['Title', 'a one-line description'],
              ['Primary risk', 'exactly one of auto-safe / owner-decision / figures-moved / blocked'],
              ['Files / categories touched', 'what this touches'],
              ['Current-state verdict', 'the source, and one of STILL BROKEN / ALREADY FIXED / PARTIALLY FIXED / FIXED BUT UNTESTED / STALE-SUPERSEDED / NEEDS OWNER ANSWER, checked on main before changing anything'],
              ['Builder surface', 'the tool this work ran on'],
              ['Primary builder model', 'the exact model name the surface displays, or a plain statement that it withholds it'],
              ['Supporting / explore models', 'each other model and what it did, or None'],
              ['Architecture / dispatch authority', 'who dispatched and architecturally owns this work'],
              ['Figures moved', 'which published figures change, or "none"'],
              ['Reproduced / disproved', 'how a claimed defect was reproduced on main before fixing, or "n/a"'],
              ['Authority impact', 'whether any fact changed its home, or "none"'],
              ['Tests', 'the exact command and its result'],
              ['Security', '"unchanged", or exactly what changed'],
              ['Advisory review', 'each automated-reviewer finding and its disposition, or "none raised"'],
              ['Owner decision required', '"No", or the question the household must answer'],
              ['Estimated inputs added', 'any new estimate, or "none"'],
            ];

            const esc = s => s.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&');
            for (const [label, want] of FIELDS) {
              // Grab the text following the bold label on its own row, up to the
              // end of the line (table cell or bullet both end at the newline).
              const row = new RegExp(
                `\\*\\*${esc(label)}\\*\\*\\s*\\|?([^\\n|]*)\\|?`, 'i').exec(body);
              if (!row) {
                problems.push(`Merge card row "${label}" is missing — ${want}.`);
                continue;
              }
              // Strip the shipped placeholder comment and see what is left.
              const value = row[1].replace(/<!--[\s\S]*?-->/g, '').trim();
              if (!value) {
                problems.push(`Merge card row "${label}" is blank — ${want}. "none" or "n/a — <reason>" is a real answer; an empty row is not.`);
              }
            }

            // Attribution: `None` is a real answer for supporting models and for
            // nothing else. Without this, `Builder surface: None` would satisfy
            // the row check above while declaring none of the attribution the row
            // exists to require — a blank wearing a word. It is the one value
            // whose permitted scope CLAUDE.md defines exactly, so it is the one a
            // literal check can enforce; every other wrong-but-answered value is
            // the reviewer's job.
            for (const label of ['Builder surface', 'Primary builder model',
                                 'Architecture / dispatch authority']) {
              const row = new RegExp(
                `\\*\\*${esc(label)}\\*\\*\\s*\\|?([^\\n|]*)\\|?`, 'i').exec(body);
              const value = row
                ? row[1].replace(/<!--[\s\S]*?-->/g, '').replace(/\*/g, '').trim() : '';
              if (/^none\.?$/i.test(value)) {
                problems.push(`Merge card row "${label}" may not be None — that answer is for supporting models alone. Name the surface, the exact model name the surface displays (or say plainly that it withholds it), and the dispatch authority.`);
              }
            }

            // The prose sections carry the reasoning, and an empty one is the
            // usual sign a card was filled to satisfy the check rather than to
            // inform a reader.
            for (const heading of ['What changed', 'Why the numbers are right',
                                   'What this does NOT do', 'Known uncertainty']) {
              const re = new RegExp(`^[ \\t]*#{2,4}[ \\t]*${esc(heading)}[ \\t]*$`, 'im');
              if (!re.test(body)) {
                problems.push(`The PR body is missing the "${heading}" section.`);
                continue;
              }
              // Everything between this heading and the next one, minus comments.
              const after = body.slice(body.search(re));
              const seg = after.slice(after.indexOf('\n') + 1).split(/^[ \t]*#{2,4}[ \t]/m)[0];
              if (!seg.replace(/<!--[\s\S]*?-->/g, '').replace(/^[-\s*]+$/gm, '').trim()) {
                problems.push(`Section "${heading}" is empty — it still holds only its template comment.`);
              }
            }

            // ---------------------------------------------------------------
            // The required review lane (CLAUDE.md). ChatGPT performs it; this
            // check only verifies the RECORD exists. It cannot tell whether a
            // review happened, and passing it is not evidence that one did.
            //
            // Anchored on the heading rather than on a mention of the phrase:
            // prose discussing the lane earlier in the body would otherwise
            // capture the wrong span and fail a card that is actually filled.
            const reviewHeading =
              /^[ \t]*#{2,4}[ \t]*Atlas Contract \/ Systems Review[ \t]*$/im.exec(body);
            if (!reviewHeading) {
              problems.push('The PR body is missing the "Atlas Contract / Systems Review" section (Required / Exact reviewed head / Reviewer / Findings and dispositions). When no trigger fired, say "not required" and why.');
            } else {
              const sec = body.slice(reviewHeading.index + reviewHeading[0].length)
                .split(/\n[ \t]*#{2,4}[ \t]+/)[0];
              const read = (label) => {
                const m = new RegExp(
                  `^[ \\t]*[-*][ \\t]*\\*{0,2}${esc(label)}\\*{0,2}[ \\t]*:(.*)$`, 'im').exec(sec);
                return m === null
                  ? null
                  : m[1].replace(/<!--[\s\S]*?-->/g, '').replace(/\*/g, '').trim();
              };
              const REVIEW = [
                ['Required', 'name the trigger that fired, or say why none did'],
                ['Exact reviewed head', 'the full 40-character commit SHA the reviewer read, or n/a'],
                ['Reviewer', 'who performed the required review, or n/a'],
                ['Findings and dispositions', 'each finding with its disposition, or "none", or "n/a"'],
              ];
              const seen = {};
              for (const [label, want] of REVIEW) {
                const v = read(label);
                if (v === null) {
                  problems.push(`The review block is missing its "${label}" line — ${want}.`);
                } else if (!v) {
                  problems.push(`Review block line "${label}" is blank — ${want}.`);
                }
                seen[label] = v || '';
              }

              // Fails CLOSED: the review counts as required unless the line says
              // otherwise. A record that claims a required review but names no
              // head is exactly the staleness the Codex freshness reporter exists
              // to catch — a verdict attached to a revision that may no longer be
              // here. Shape only; that the SHA is the real head stays a human's
              // read, and so does whether the named reviewer actually looked.
              const req = seen['Required'];
              const notRequired = /\bnot[ \t]+required\b/i.test(req)
                || /^(no|none|n\/a)\b/i.test(req);
              if (req && !notRequired) {
                const headLine = seen['Exact reviewed head'];
                // A line that names a SHA *and* says the review has not happened
                // is a contradiction, and the SHA wins on a bare pattern match —
                // the first body ever written against this check said "record
                // <sha> here once ChatGPT has read it" and went green. A pending
                // required review is an honest state; the honest result is red.
                const pending = /\b(pending|not yet|tbd|awaiting|outstanding)\b/i.test(headLine);
                const recorded = pending
                  ? '' : (/\b[0-9a-f]{40}\b/i.exec(headLine) || [''])[0];
                const head = ((context.payload.pull_request || {}).head || {}).sha || '';
                if (pending) {
                  problems.push('The review is recorded as required and "Exact reviewed head" says it has not happened yet. Red is the correct result: record the SHA once the reviewer has read this exact head. Leave the SHA out of the line until then — naming it alongside "pending" reads as a review that did not occur.');
                } else if (!recorded) {
                  problems.push('The review is recorded as required, so "Exact reviewed head" must carry the full 40-character SHA the reviewer actually read. A review of an earlier commit does not cover this head.');
                } else if (head && recorded.toLowerCase() !== head.toLowerCase()) {
                  // The mechanical form of the exact-head rule. It is still a
                  // literal check — two strings — and it proves only which commit
                  // the card CLAIMS was read. Whether a review happened, and
                  // whether it was any good, stays a human's judgement. What it
                  // removes is the one failure a literal check can remove: a
                  // verdict quietly outliving the code it was about.
                  problems.push(`The recorded reviewed head \`${recorded.slice(0, 7)}\` is not this pull request's head \`${head.slice(0, 7)}\`. A review of an earlier commit does not cover a later one — repeat the review against the current head and record its SHA.`);
                }
                if (!seen['Reviewer'] || /^n\/a\b/i.test(seen['Reviewer'])) {
                  problems.push('The review is recorded as required, so "Reviewer" must name who performed it.');
                }
              }
            }

            // Every finding made along the way takes exactly one disposition, so
            // a real one cannot quietly evaporate between the comment that raised
            // it and the merge.
            const findingsHeading =
              /^[ \t]*#{2,4}[ \t]*Additional findings[ \t]*$/im.exec(body);
            if (!findingsHeading) {
              problems.push('The PR body is missing the "Additional findings" section (None / FIXED NOW / REJECTED / ADDED TO BACKLOG / OWNER DECISION REQUIRED).');
            } else {
              const sec = body.slice(findingsHeading.index + findingsHeading[0].length)
                .split(/\n[ \t]*#{2,4}[ \t]+/)[0];
              if (!/^[ \t]*[-*][ \t]*(None|FIXED NOW|REJECTED|ADDED TO BACKLOG|OWNER DECISION REQUIRED)\b/im.test(sec)) {
                problems.push('"Additional findings" must record at least one disposition: None, FIXED NOW, REJECTED, ADDED TO BACKLOG, or OWNER DECISION REQUIRED.');
              }
            }

            if (problems.length) {
              core.summary.addHeading('Merge card incomplete', 3);
              core.summary.addList(problems);
              core.summary.addRaw('\nThis check is literal: it verifies each field was answered, not that the answers are correct.');
              await core.summary.write();
              core.setFailed(`${problems.length} merge-card problem(s):\n  - ` + problems.join('\n  - '));
            } else {
              core.summary.addRaw('✅ Merge card present and every field answered.\n\n' +
                '_Literal check only — that the fields are filled, not that they are true._');
              await core.summary.write();
            }
