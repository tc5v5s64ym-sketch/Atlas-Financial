name: Atlas ChatGPT review bridge

# ChatGPT Work writes an untrusted, structured result comment through a
# distinct review-only GitHub identity. This default-branch workflow
# verifies that identity is not the shared Codex/builder connector,
# correlates the result to a trusted exact-head wake-up, re-checks
# REQUIRED/green eligibility, and only then uses the existing
# owner-authorized GitHub token to create the trusted Atlas review. It
# never calls an OpenAI API and never checks out or executes PR-head code.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  bridge:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '<!-- atlas-chatgpt-review-result -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLAS_CHATGPT_WORK_LOGIN: ${{ vars.ATLAS_CHATGPT_WORK_LOGIN }}
    steps:
      - name: Checkout trusted default-branch helpers
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate and publish the trusted Atlas review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ATLAS_AUTOMATION_TOKEN }}
          script: |
            const path = require('path');
            const bridge = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/atlas-chatgpt-review-bridge.js'));
            const card = require(path.join(process.env.GITHUB_WORKSPACE, 'scripts/atlas-review-block.js'));
            const { owner, repo } = context.repo;
            const issueNumber = Number(context.payload.issue.number);
            const sourceLogin = String(context.payload.comment.user.login || '');
            const sourceBody = String(context.payload.comment.body || '');
            const reviewBodyPreview = bridge.reviewBodyFromComment(sourceBody);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issueNumber });
            if (!bridge.isOpenMainPr(pr) || !bridge.isFullSha(pr.head.sha) || !reviewBodyPreview
                || bridge.claimedHead(reviewBodyPreview) !== String(pr.head.sha).toLowerCase()) {
              core.info('Stale, closed, draft, retargeted, or mismatched-head result ignored.');
              return;
            }
            const liveHead = String(pr.head.sha).toLowerCase();

            const [checks, statuses, reviews, comments] = await Promise.all([
              github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: liveHead, per_page: 100,
              }),
              github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner, repo, ref: liveHead, per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: issueNumber, per_page: 100,
              }),
              github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issueNumber, per_page: 100,
              }),
            ]);

            const authenticated = await github.rest.users.getAuthenticated();
            const reviewerLogin = String(authenticated.data && authenticated.data.login || '');
            if (reviewerLogin !== bridge.TRUSTED_REVIEWER) {
              core.setFailed(`ATLAS_AUTOMATION_TOKEN resolved to ${reviewerLogin || '(empty)'}, not ${bridge.TRUSTED_REVIEWER}.`);
              return;
            }
            if (card.selectCardReview(reviews, liveHead)) {
              core.info('A trusted Atlas review already exists on the live exact head.');
              return;
            }

            const decision = bridge.decidePublish({
              sourceLogin,
              configuredWorkLogin: process.env.ATLAS_CHATGPT_WORK_LOGIN,
              sourceBody,
              commentCreatedAt: context.payload.comment.created_at,
              performedViaApp: context.payload.comment.performed_via_github_app,
              pr,
              checks,
              statuses,
              reviews,
              comments,
            });
            core.info(`#${issueNumber}: ${decision.code} — ${decision.reason}`);
            if (!decision.ok) {
              if (bridge.isHardFail(decision.code)) {
                core.setFailed(decision.reason);
              }
              return;
            }

            const evaluated = card.evaluateTrustedReview({
              source: 'pull_request_review',
              reviewerLogin,
              reviewedSha: liveHead,
              currentHeadSha: liveHead,
              reviewBody: decision.reviewBody,
              pr: {
                state: pr.state,
                base: { ref: pr.base.ref },
                head: { sha: liveHead, ref: pr.head.ref },
              },
            });
            if (!evaluated.ok) {
              core.setFailed(`ChatGPT Work result failed Atlas review validation: ${evaluated.reason}`);
              return;
            }

            const posted = await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: issueNumber,
              commit_id: liveHead,
              body: decision.reviewBody,
              event: 'COMMENT',
            });
            core.info(`Posted trusted Atlas ${evaluated.outcome} review ${posted.data.id} on ${liveHead}.`);
