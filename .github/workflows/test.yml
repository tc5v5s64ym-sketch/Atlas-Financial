# The financial publication correctness suite.
#
# No secrets are used or needed. Everything here runs against the tracked
# repository alone: the password gate and the live-site checks are deliberately
# excluded because they need SITE_PASSWORD and a deployed instance, and putting
# either into CI would mean putting a secret somewhere new.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # B20 independent proof reads historical `data.json` / `positions.csv`
          # via `git show 81210ac` and `git show 08fd3e1`. The default shallow
          # checkout cannot see those commits, so the required suite would go
          # red without the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies are needed to run the suite — it is plain Node — so the
      # install is skipped rather than pulling express in to sit unused.
      - name: Run the correctness suite
        run: npm test

      # The hook is the primary guard against committing raw statements or an
      # identifier. It does not run in CI, so the same content scan is repeated
      # inside test-static.js; this step just proves the hook is still shipped.
      - name: Confirm the pre-commit guard is still present
        run: test -f .githooks/pre-commit
