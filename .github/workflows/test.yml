# The financial publication correctness suite.
#
# No production secrets are used or needed. Synthetic SITE_PASSWORD /
# SESSION_SECRET values exist only in the local production-boundary suite so
# authenticated `/data.json` can be proved without a deployed instance.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # B20 independent proof reads historical `data.json` / `positions.csv`
          # via `git show 81210ac` and `git show 08fd3e1`. The default shallow
          # checkout cannot see those commits, so the required suite would go
          # red without the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # express is the production server runtime. The production-boundary
      # suite starts server.js locally with synthetic secrets.
      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Run the correctness suite
        run: npm test

      # Local commits run .githooks/pre-commit, which delegates to
      # scripts/privacy-guard.js. GitHub API commits never run that hook.
      # privacy-guard.yml applies the trusted default-branch copy of the same
      # engine. This step only proves both files are still shipped.
      # test-static.js keeps a generic card/SIN scan, not a second household
      # identifier list.
      - name: Confirm the privacy-guard engine is still present
        run: test -f .githooks/pre-commit && test -f scripts/privacy-guard.js
