name: Atlas first-review dispatch

# PR-controlled and deliberately secret-free. It only records that an open
# non-draft pull request targeting main changed. The secret-bearing reviewer
# runs from default-branch code through workflow_run, re-fetches the live Merge
# Card, and spends the OpenAI API only when that card says Required: REQUIRED
# and no trusted Atlas verdict already exists on the exact head.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  note:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record first-review wake-up
        run: |
          set -euo pipefail
          echo "First-review dispatch for PR ${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}."
