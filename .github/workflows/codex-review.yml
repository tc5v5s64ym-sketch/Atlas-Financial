name: Request Codex review

# Asks Codex to review again when the head changes in a way that matters.
#
# Codex already reviews on open and on ready-for-review — that part is
# configured outside this repository, in the org's Codex settings, and nothing
# here controls it. The gap is what happens NEXT. On this repository's first
# PR, Codex reviewed the opening head, found two real P1s, both were fixed and
# pushed, and it never looked again: its verdict stayed attached to a revision
# that no longer existed. A review of superseded code reads exactly like a
# review of the current one.
#
# So this re-requests a review when the head moves, and only then. Three
# deliberate limits keep it from becoming noise:
#
#   · DRAFTS ARE SKIPPED. Work in progress does not need a reviewer.
#   · PATHS ARE FILTERED. A push touching only docs, tests or workflows does
#     not re-request; a push touching the engine, the published figures or the
#     Plan page does. What Codex is good at here is the maths and the wiring.
#   · ONE REQUEST PER HEAD SHA. The marker comment records which SHA was asked
#     about, so a re-run, a label event or a second synchronize on the same
#     commit cannot ask twice.
#
# HONEST LIMIT: this posts a comment as `github-actions[bot]`. Codex is a
# GitHub App reacting to webhooks rather than a workflow, so it should see a
# bot comment — but that is the org's integration behaving as documented, not
# something this repository can guarantee. If a re-review does not appear,
# comment `@codex review` by hand; the merge card's advisory-review row still
# has to be answered either way, which is the part that actually holds.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    name: Ask Codex to look again
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this head is worth a re-review
        id: decide
        run: |
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" 2>/dev/null || true
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
          echo "changed files:"; echo "$CHANGED" | sed 's/^/  /'
          # The maths and the wiring. Documentation and workflow changes are
          # reviewed by a person reading them, not by a code reviewer.
          if echo "$CHANGED" | grep -qE '^(public/(forecast|plan|app|deepdive|records|modellers)\.js|data\.json|server\.js|scripts/.*\.js|test.*\.js)$'; then
            echo "worthwhile=true" >> "$GITHUB_OUTPUT"
          else
            echo "worthwhile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request a review, once per head
        if: steps.decide.outputs.worthwhile == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const MARKER = `<!-- atlas-codex-request ${sha} -->`;

            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 });

            if (comments.some(c => c.body && c.body.includes(MARKER))) {
              core.info(`A review has already been requested for ${sha.slice(0, 7)}.`);
              return;
            }
            // On `opened`, Codex reviews of its own accord — asking as well
            // would produce two reviews of the same commit.
            if (context.payload.action === 'opened') {
              core.info('Opened: Codex reviews on its own for this event. Recording the SHA only.');
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                body: `${MARKER}\n<sub>Codex reviews new pull requests automatically — no request sent for \`${sha.slice(0, 7)}\`.</sub>` });
              return;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `${MARKER}\n@codex review\n\n` +
                `<sub>The head moved to \`${sha.slice(0, 7)}\` and it touches the engine, the published ` +
                `figures or a page script — so the previous review now describes code that is no longer ` +
                `here. Requested automatically; one request per head SHA.</sub>\n\n` +
                `---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
            core.info(`Requested a Codex review for ${sha.slice(0, 7)}.`);
