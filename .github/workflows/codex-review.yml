name: Codex review freshness

# Says whether the Codex review on this PR still describes the code that is
# actually here.
#
# THE PROBLEM. Codex reviews on open and on ready-for-review, not after a push.
# On this repository's first PR it reviewed the opening head, found two real
# P1s, both were fixed and pushed — and it never looked again. Its verdict sat
# there attached to a revision that no longer existed, which reads exactly like
# a review of the current one. A stale approval is worse than no approval.
#
# WHAT THIS DOES NOT DO, AND WHY. The obvious fix is to post `@codex review`
# from CI. That was tried here and it does not work: Codex answers a mention
# from `github-actions[bot]` with "create a Codex account and connect to
# github", because the requesting identity must be a linked human account. The
# result was two useless comments on every push — the request and the refusal.
# Making it work would mean storing a human PAT as a repository secret, and in
# this repo secrets live only in Render and nowhere else. Not worth it for a
# convenience.
#
# So this reports rather than requests. It compares the newest commit Codex
# actually reviewed against the current head and keeps ONE comment updated in
# place, never adding a second. When the review is stale, a human comments
# `@codex review` — which takes a moment and works.
#
# The part that actually holds is neither of these: it is the merge card's
# `Advisory review` row, which has to say what happened to each finding before
# the card check passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-freshness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Is the Codex review current
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare the reviewed head with the current one
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const head = pr.head.sha;
            const MARKER = '<!-- atlas-codex-freshness -->';
            const isCodex = login => /codex/i.test(login || '');

            // Which commit did Codex last actually look at? Reviews carry the
            // SHA they were submitted against; review comments carry it too.
            // Take the newest of either.
            const reviews = await github.paginate(github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const comments = await github.paginate(github.rest.pulls.listReviewComments,
              { owner, repo, pull_number: pr.number, per_page: 100 });

            const seen = [
              ...reviews.filter(r => isCodex(r.user && r.user.login))
                .map(r => ({ sha: r.commit_id, at: r.submitted_at })),
              ...comments.filter(c => isCodex(c.user && c.user.login))
                .map(c => ({ sha: c.original_commit_id || c.commit_id, at: c.created_at })),
            ].filter(x => x.sha).sort((a, b) => (a.at < b.at ? 1 : -1));

            const commits = await github.paginate(github.rest.pulls.listCommits,
              { owner, repo, pull_number: pr.number, per_page: 250 });
            const order = commits.map(c => c.sha);
            const short = s => (s || '').slice(0, 7);

            let body;
            if (!seen.length) {
              body = `${MARKER}\n### 🤖 Codex review — none yet\n\n` +
                `No Codex review has landed on this PR. It normally reviews on open and on ` +
                `ready-for-review; if it has not, comment \`@codex review\`.\n\n` +
                `Either way the merge card's **Advisory review** row still has to be answered — ` +
                `\`none raised\` is a valid answer once a review has come back clean.`;
            } else if (seen[0].sha === head) {
              body = `${MARKER}\n### 🤖 Codex review — current\n\n` +
                `Codex has reviewed \`${short(head)}\`, which is the current head. Its findings ` +
                `describe the code that is actually here.\n\n` +
                `Record what happened to each one in the merge card's **Advisory review** row: ` +
                `fixed, non-issue with the reason, or deferred to the backlog.`;
            } else {
              const i = order.indexOf(seen[0].sha);
              const behind = i >= 0 ? order.length - 1 - i : null;
              body = `${MARKER}\n### 🤖 Codex review — **stale**\n\n` +
                `Codex last reviewed \`${short(seen[0].sha)}\`` +
                (behind ? `, which is **${behind} commit${behind === 1 ? '' : 's'} behind** the head` : '') +
                ` — the head is now \`${short(head)}\`.\n\n` +
                `Its findings, and any clean bill of health, describe code that is no longer here. ` +
                `**Comment \`@codex review\` to refresh it.** CI cannot do that: Codex requires the ` +
                `request to come from a linked account, and refuses one from \`github-actions[bot]\`.`;
            }

            body += `\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;

            const all = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 });
            const existing = all.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            // Clean up the abandoned auto-request comments from the earlier
            // approach, so the thread does not keep a record of a mechanism
            // that was removed for not working.
            for (const c of all) {
              if (c.body && c.body.includes('<!-- atlas-codex-request ')) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                core.info(`removed stale auto-request comment ${c.id}`);
              }
            }
