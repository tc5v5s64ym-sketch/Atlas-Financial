name: Published figures review

# Says, on every pull request, exactly which figures the household would see
# change if this merged.
#
# This is the review this repository actually needs. The defect that started
# the correctness work was a weekly spending cap that was wrong by $400 and
# looked entirely plausible on the page — no test failed, nothing crashed, and
# the number simply stated something untrue. A diff of `data.json` would not
# have shown it, because the figure was DERIVED. So instead of reading the
# source, this runs the engine on both revisions and compares the answers.
#
# It is deliberately NON-BLOCKING. A figure moving is usually the entire point
# of the change; the failure mode is a figure moving unnoticed. The blocking
# partner is `merge-card-check`, which requires the PR body to say which
# figures were expected to move.
#
# TRUST MODEL: this runs under `pull_request`, not `pull_request_target`, so
# the token is scoped to this PR and no repository secret is exposed to PR
# code. It does execute the head revision's snapshot script — acceptable here
# because the repository is private and single-owner, and because refusing to
# run PR code would mean never being able to report on PR figures at all.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: figures-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    name: Which published figures moved
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The snapshot script is run from EACH revision's own checkout, never one
      # revision's script against the other's data. The engine's shape changes
      # between revisions — that is the whole reason the script lives beside it.
      - name: Snapshot the head
        run: node scripts/figures-snapshot.js > "$RUNNER_TEMP/head.json"

      - name: Snapshot the base
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          if [ -f "$RUNNER_TEMP/base/scripts/figures-snapshot.js" ]; then
            ( cd "$RUNNER_TEMP/base" && node scripts/figures-snapshot.js ) > "$RUNNER_TEMP/base.json"
          else
            # The script itself is new. Say so rather than reporting every
            # figure as an addition.
            echo 'null' > "$RUNNER_TEMP/base.json"
          fi

      - name: Compare and report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const head = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/head.json', 'utf8'));
            const base = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/base.json', 'utf8'));
            const MARKER = '<!-- atlas-figures-review -->';

            const money = v => typeof v === 'number'
              ? (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-CA',
                  { minimumFractionDigits: 2, maximumFractionDigits: 2 })
              : String(v);
            // A key is money unless it is plainly a date, a count or a verdict.
            const isCount = k => /facilitiesOverLimit|openCount|windowDays/.test(k);
            const fmt = (k, v) => v === undefined ? '—'
              : typeof v !== 'number' ? '`' + v + '`'
              : isCount(k) ? String(v) : money(v);

            let body;
            if (base === null) {
              const rows = Object.entries(head)
                .map(([k, v]) => `| \`${k}\` | ${fmt(k, v)} |`).join('\n');
              body = `${MARKER}\n### 📊 Published figures\n\n` +
                `The snapshot script is introduced by this PR, so there is no baseline to ` +
                `compare against. These are the figures as of this head — every future PR ` +
                `will diff against them.\n\n| Figure | Value |\n|---|---|\n${rows}\n`;
            } else {
              const keys = [...new Set([...Object.keys(base), ...Object.keys(head)])].sort();
              const moved = keys.filter(k => {
                const a = base[k], b = head[k];
                if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) > 0.005;
                return a !== b;
              });
              if (!moved.length) {
                body = `${MARKER}\n### 📊 Published figures — unchanged\n\n` +
                  `Every one of the ${keys.length} figures the household can read off the ` +
                  `Plan page is identical on this head and on \`${context.payload.pull_request.base.ref}\`. ` +
                  `Whatever this PR changes, it does not change what the household is told.\n`;
              } else {
                const rows = moved.map(k => {
                  const a = base[k], b = head[k];
                  let delta = '';
                  if (typeof a === 'number' && typeof b === 'number' && !isCount(k)) {
                    const d = b - a;
                    delta = (d >= 0 ? '+' : '−') + money(Math.abs(d)).replace(/^[−$]+/, '$');
                  } else if (typeof a === 'number' && typeof b === 'number') {
                    const d = b - a;
                    delta = (d >= 0 ? '+' : '−') + Math.abs(d);
                  } else if (a === undefined) { delta = 'new'; }
                  else if (b === undefined) { delta = 'removed'; }
                  else { delta = 'changed'; }
                  return `| \`${k}\` | ${fmt(k, a)} | **${fmt(k, b)}** | ${delta} |`;
                }).join('\n');
                body = `${MARKER}\n### 📊 ${moved.length} published figure${moved.length === 1 ? '' : 's'} moved\n\n` +
                  `Computed by running the engine on \`${context.payload.pull_request.base.ref}\` and on this ` +
                  `head, not by reading the diff — the figure that started all of this was a derived one, ` +
                  `and a source diff would not have shown it.\n\n` +
                  `**Every row below is something the household would read differently.** ` +
                  `Confirm each was intended and is stated on the merge card.\n\n` +
                  `| Figure | ${context.payload.pull_request.base.ref} | this PR | Δ |\n|---|---|---|---|\n${rows}\n\n` +
                  `<sub>${keys.length - moved.length} other figures unchanged.</sub>\n`;
              }
            }

            body += `\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;

            // One comment per PR, updated in place — a new comment on every push
            // would bury the thread it is supposed to inform.
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }))
              .find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
