name: Published figures review

# Public counts describe change only. They never satisfy the owner's private
# figure-level reconciliation. Changed or missing-baseline comparisons stay
# incomplete until that existing requirement is satisfied privately.
#
# This is the review this repository actually needs. The defect that started
# the correctness work was a weekly spending cap that was wrong by $400 and
# looked entirely plausible on the page — no test failed, nothing crashed, and
# the number simply stated something untrue. A diff of `data.json` would not
# have shown it, because the figure was DERIVED. So instead of reading the
# source, this runs the engine on both revisions and compares the answers.
#
# A figure moving is usually the point of a change. Public counts can flag
# that change, but cannot complete the required private owner reconciliation.
# Changed or missing-baseline comparisons, and any added, edited or removed
# invented input, remain withheld. No self-attested receipt makes that evidence
# accepted.
#
# WHAT IS COMPARED: each revision's own check snapshot covers the household
# dated opening (counts only ever leave the runner) and the invented inputs in
# test/fixtures/figures-inputs, plus a coverage manifest for a fixed vocabulary
# of declared field classes. A declared class that no input observes, or a
# manifest that does not reconcile with the captured fields, reads INCOMPLETE
# and fails, never "unchanged". Household figures at a live opening, page
# rendering and page-side decisions are outside the comparison, and every
# comment says so. Unchanged and complete comparisons succeed.
#
# TRUST MODEL: this runs under `pull_request`, not `pull_request_target`, so
# the token is scoped to this PR and no repository secret is exposed to PR
# code. Snapshot and comment formatting execute the head revision as
# unprivileged processes (no GITHUB_TOKEN / GH_TOKEN). The pull-requests:write
# step reads only the inert snapshots and the formatted markdown, recomputes
# the whole public body itself and posts it only on byte equality; it does not
# require() PR JavaScript. Snapshots stay in RUNNER_TEMP and are never uploaded.
# Refusing to run PR snapshot code at all would mean never being able to report
# on PR figures.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: figures-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    name: Which published figures moved
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The snapshot script is run from EACH revision's own checkout, never one
      # revision's script against the other's data. The engine's shape changes
      # between revisions — that is the whole reason the script lives beside it.
      - name: Snapshot the head
        run: env -u GITHUB_TOKEN -u GH_TOKEN node scripts/ci-output.js --identity figures-head-snapshot --stdout-file "$RUNNER_TEMP/head.json" -- env -u GITHUB_TOKEN -u GH_TOKEN node scripts/figures-snapshot.js

      - name: Snapshot the base
        run: |
          env -u GITHUB_TOKEN -u GH_TOKEN node scripts/ci-output.js --identity figures-base-checkout -- git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          if [ -f "$RUNNER_TEMP/base/scripts/figures-snapshot.js" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN node scripts/ci-output.js --identity figures-base-snapshot --cwd "$RUNNER_TEMP/base" --stdout-file "$RUNNER_TEMP/base.json" -- env -u GITHUB_TOKEN -u GH_TOKEN node scripts/figures-snapshot.js
          else
            # The script itself is new. Say so rather than reporting every
            # figure as an addition.
            echo 'null' > "$RUNNER_TEMP/base.json"
          fi

      - name: Format the figures comment
        run: |
          env -u GITHUB_TOKEN -u GH_TOKEN \
            node scripts/ci-output.js --identity figures-comment --stdout-file "$RUNNER_TEMP/comment.md" -- \
            node scripts/figures-comment.js \
              "$RUNNER_TEMP/base.json" \
              "$RUNNER_TEMP/head.json" \
              "${{ github.base_ref }}" --public-summary

      - name: Post the figures comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- atlas-figures-review -->';
            try {
            let body = fs.readFileSync(process.env.RUNNER_TEMP + '/comment.md', 'utf8');
            // The entire public body is RECOMPUTED here from the inert snapshots,
            // independently of the PR formatter, and posted only on byte
            // equality. No PR JavaScript runs with the posting token; a formatter
            // cannot smuggle a value, a key, an id or a class name as text or as
            // a count. Every word below is a constant of this step.
            const base = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/base.json', 'utf8'));
            const head = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/head.json', 'utf8'));
            const scalarMap = map => map !== null && typeof map === 'object' && !Array.isArray(map)
              && Object.keys(map).every(key => { const v = map[key]; return v === null || typeof v === 'string'
                || typeof v === 'boolean' || (typeof v === 'number' && Number.isFinite(v)); });
            if (!scalarMap(head) || (base !== null && !scalarMap(base))) throw new Error('invalid-public-summary');
            const has = (map, key) => map !== null && Object.prototype.hasOwnProperty.call(map, key);
            const SCHEMA = 'atlas-figures-check/v2', ID = /^[a-z][a-z0-9-]{0,47}$/, DIGEST = /^[a-f0-9]{64}$/;
            const CHECK_KEYS = ['check.schema', 'check.collector.sha256', 'check.household.input.sha256'];
            // The reviewed fixed field-class vocabulary: id, key pattern, kind. It
            // mirrors the formatter's FIELD_CLASSES; a test pins the two together.
            const CLASSES = [
              ['cash-spendable-today', 'cash.spendableToday', 'money'], ['plan-weekly-cap', 'plan.weeklyCap', 'money'],
              ['plan-lowest-cash', 'plan.lowestCash', 'money'], ['plan-opening-gap', 'plan.gapAmount', 'money'],
              ['plan-funding-borrowed', 'plan.fundingBorrowed', 'money'], ['payday-available', 'payday.available', 'money'],
              ['payday-risk-shortfall', 'payday.riskShortfall', 'money'],
              ['operating-this-remainder', 'operating.this.projectedEnding', 'money'],
              ['scoreboard-consumer-debt', 'scoreboard.*.consumerDebt', 'money'],
              ['budget-breakdown-required', 'budget.requiredPerMonth', 'money'],
              ['budget-period-opening', 'period.*.opening', 'money'], ['budget-period-opening-source', 'period.*.openingSource', 'tag'],
              ['budget-period-income', 'period.*.incomeTotal', 'money'], ['budget-period-bill-load', 'period.*.periodBillLoad', 'money'],
              ['budget-period-after-bills', 'period.*.afterBills', 'money'], ['budget-period-hold', 'period.*.budgetHold', 'money'],
              ['budget-period-bad', 'period.*.balanceAfterDeductions', 'money'], ['budget-period-sweep', 'period.*.paydaySweep', 'money'],
              ['budget-period-planned-close', 'period.*.plannedPeriodClose', 'money'],
              ['budget-period-operating-plan', 'period.*.operatingPlanUnavailable', 'flag'],
              ['budget-period-bill-amount', 'period.*.bill.*.amount', 'money'],
              ['budget-period-bill-status', 'period.*.bill.*.status', 'tag'],
              ['budget-period-card-paid-bill', 'period.*.bill.*.cardPaid', 'true'],
              ['budget-bills-at-end', 'period.billsAtEnd.amount', 'money'],
              ['budget-period-opening-trust', 'period.*.openingTrust', 'tag'], ['budget-period-income-trust', 'period.*.incomeTrust', 'tag'],
              ['budget-period-bill-load-trust', 'period.*.periodBillLoadTrust', 'tag'],
              ['budget-period-after-bills-trust', 'period.*.afterBillsTrust', 'tag'],
              ['budget-period-hold-trust', 'period.*.budgetHoldTrust', 'tag'],
              ['budget-period-bad-trust', 'period.*.balanceAfterDeductionsTrust', 'tag'],
              ['budget-period-sweep-trust', 'period.*.paydaySweepTrust', 'tag'],
              ['budget-period-planned-close-trust', 'period.*.plannedPeriodCloseTrust', 'tag'],
              ['budget-period-bill-confidence', 'period.*.bill.*.confidence', 'tag'],
              ['budget-period-bill-display-trust', 'period.*.bill.*.displayAmountTrust', 'tag'],
              ['budget-bills-at-end-trust', 'period.billsAtEnd.trust', 'tag'], ['bills-row-confidence', 'bills.*.confidence', 'tag'],
              ['subscriptions-row-confidence', 'subscriptions.*.confidence', 'tag'], ['credit-row-confidence', 'credit.*.confidence', 'tag'],
              ['credit-minimum-confidence', 'credit.*.minimumConfidence', 'tag'],
              ['credit-minimum-date-confidence', 'credit.*.minimumDateConfidence', 'tag'],
              ['savings-close-trust', 'savings.period.*.close.trust', 'tag'],
              ['savings-close-row-still-to-fund-trust', 'savings.period.*.close.row.*.stillToFundTrust', 'tag'],
              ['savings-planned-still-to-fund-trust', 'savings.period.*.planned.row.*.stillToFundTrust', 'tag'],
              ['savings-current-still-to-fund-trust', 'savings.current.row.*.stillToFundTrust', 'tag'],
              ['savings-inventory-setup', 'savings.setup', 'tag'], ['savings-funding-status', 'savings.funding.status', 'tag'],
              ['savings-close-status', 'savings.period.*.close.status', 'tag'], ['savings-close-nature', 'savings.period.*.close.nature', 'tag'],
              ['savings-close-stock', 'savings.period.*.close.stock', 'money'],
              ['savings-close-contribution', 'savings.period.*.close.contribution', 'money'],
              ['savings-close-deficit-coverage', 'savings.period.*.close.projectedDeficitCoverage', 'money'],
              ['savings-close-gap', 'savings.period.*.close.gapShortBy', 'money'],
              ['savings-close-row-saved', 'savings.period.*.close.row.*.forecastSaved', 'money'],
              ['savings-close-row-still-to-fund', 'savings.period.*.close.row.*.stillToFund', 'money'],
              ['savings-planned-needed', 'savings.period.*.planned.row.*.needed', 'money'],
              ['savings-current-still-to-fund', 'savings.current.row.*.stillToFund', 'money'],
              ['savings-current-surplus', 'savings.current.nativePeriodSurplus', 'money'],
              ['bills-row-amount', 'bills.*.amount', 'money'], ['subscriptions-row-amount', 'subscriptions.*.amount', 'money'],
              ['credit-balance', 'credit.*.balance', 'money'], ['credit-minimum', 'credit.*.minimum', 'money'],
              ['planning-verdict', 'planning.*.verdict', 'tag'], ['planning-trajectory-cash', 'planning.trajectory.*.cash.amount', 'money'],
            ].map(([id, pattern, kind]) => ({ id, segments: pattern.split('.'), kind }));
            const FAMILIES = ['Plan', 'Budget', 'Savings', 'Bills', 'Subscriptions', 'Credit', 'Planning', 'Trust', 'Coverage', 'Other'];
            const role = key => {
              if (key.startsWith('check.')) return { role: 'meta' };
              if (key.startsWith('coverage.')) return { role: 'coverage' };
              if (!key.startsWith('fixture.')) return { role: 'household', inner: key };
              const rest = key.slice(8), dot = rest.indexOf('.');
              const id = dot > 0 ? rest.slice(0, dot) : '', inner = dot > 0 ? rest.slice(dot + 1) : '';
              return { role: inner === 'input.sha256' ? 'digest' : 'invented', id, inner };
            };
            const family = inner => {
              if (/(?:trust|confidence)$/i.test(inner.slice(inner.lastIndexOf('.') + 1))) return 'Trust';
              for (const [prefix, name] of [['period.', 'Budget'], ['savings.', 'Savings'], ['bills.', 'Bills'],
                ['subscriptions.', 'Subscriptions'], ['credit.', 'Credit'], ['planning.', 'Planning']]) {
                if (inner.startsWith(prefix)) return name;
              }
              return /^(meta|cash|plan|payday|operating|totals|budget|scoreboard|debt|balance|heloc|action|policy)\./.test(inner)
                ? 'Plan' : 'Other';
            };
            const matches = (segments, key) => {
              const parts = key.split('.');
              return parts.length === segments.length
                && segments.every((s, i) => (s === '*' ? parts[i] !== '' : s === parts[i]));
            };
            const observes = (kind, v) => (kind === 'money' ? typeof v === 'number' && Number.isFinite(v)
              : kind === 'tag' ? typeof v === 'string' && v.length > 0 : kind === 'flag' ? typeof v === 'boolean'
                : kind === 'true' && v === true);
            const differs = (a, b) => (typeof a === 'number' && typeof b === 'number' ? Math.abs(a - b) > 0.005 : a !== b);
            const digests = map => {
              const out = new Map();
              if (map !== null) {
                for (const key of Object.keys(map)) {
                  const r = role(key);
                  if (r.role === 'digest' && ID.test(r.id) && typeof map[key] === 'string' && DIGEST.test(map[key])) out.set(r.id, map[key]);
                }
              }
              return out;
            };
            const baseInputs = digests(base), headInputs = digests(head), status = new Map();
            for (const [id, digest] of headInputs) {
              status.set(id, base === null || !baseInputs.has(id) ? 'added' : baseInputs.get(id) === digest ? 'common' : 'edited');
            }
            for (const id of baseInputs.keys()) if (!headInputs.has(id)) status.set(id, 'removed');
            const inputs = { common: 0, added: 0, edited: 0, removed: 0, moved: 0 };
            for (const s of status.values()) inputs[s]++;
            const rows = FAMILIES.map(() => [0, 0, 0, 0]);
            let compared = 0, changed = 0;
            for (const key of [...new Set([...Object.keys(base || {}), ...Object.keys(head)])].sort()) {
              const r = role(key);
              if (r.role === 'meta' || r.role === 'digest' || (r.role === 'invented' && status.get(r.id) !== 'common')) continue;
              const moved = base === null || differs(base[key], head[key]);
              const row = rows[FAMILIES.indexOf(r.role === 'coverage' ? 'Coverage' : family(r.inner))];
              const column = (r.role === 'coverage' ? key.endsWith('.invented') : r.role === 'invented') ? 2 : 0;
              row[column]++;
              if (moved) { row[column + 1]++; changed++; if (r.role === 'invented') inputs.moved++; }
              compared++;
            }
            // Coverage: recomputed from the captured keys and the fixed vocabulary,
            // then reconciled with the manifest the snapshot claims.
            let invalid = head['check.schema'] === SCHEMA ? 0 : 1;
            const seenHousehold = new Set(), seenInvented = new Map(CLASSES.map(c => [c.id, new Set()]));
            for (const key of Object.keys(head)) {
              const r = role(key);
              if (r.role === 'meta') { if (!CHECK_KEYS.includes(key)) invalid++; continue; }
              if (r.role === 'coverage') continue;
              if (r.role === 'digest' || (r.role === 'invented' && !headInputs.has(r.id))) {
                if (!headInputs.has(r.id)) invalid++;
                continue;
              }
              for (const c of CLASSES) {
                if (!matches(c.segments, r.inner) || !observes(c.kind, head[key])) continue;
                if (r.role === 'household') seenHousehold.add(c.id); else seenInvented.get(c.id).add(r.id);
              }
            }
            const expectedKeys = new Set();
            let observed = 0, byHousehold = 0, byInvented = 0, unobserved = 0;
            for (const c of CLASSES) {
              const h = seenHousehold.has(c.id) ? 1 : 0, i = seenInvented.get(c.id).size;
              for (const [key, actual, max] of [['coverage.' + c.id + '.household', h, 1],
                ['coverage.' + c.id + '.invented', i, headInputs.size]]) {
                expectedKeys.add(key);
                const claim = has(head, key) ? head[key] : undefined;
                if (!Number.isSafeInteger(claim) || claim < 0 || claim > max || claim !== actual) invalid++;
              }
              if (h + i > 0) observed++; else unobserved++;
              if (h) byHousehold++;
              if (i) byInvented++;
            }
            for (const key of Object.keys(head)) if (key.startsWith('coverage.') && !expectedKeys.has(key)) invalid++;
            const digestState = key => {
              const valid = map => has(map, key) && typeof map[key] === 'string' && DIGEST.test(map[key]);
              return !valid(head) ? 'unknown' : !valid(base) ? 'introduced' : base[key] === head[key] ? 'unchanged' : 'changed';
            };
            const state = base === null ? 'introduced' : changed ? 'changed' : 'unchanged';
            const incomplete = invalid !== 0 || unobserved !== 0;
            const withheld = state !== 'unchanged' || inputs.added + inputs.edited + inputs.removed > 0;
            const expected = MARKER + '\n### Published figures - public summary\n\n'
              + 'Comparison: ' + state + '.\n'
              + 'Coverage: ' + (incomplete ? 'INCOMPLETE' : 'complete') + '.\n\n'
              + '| Publication family | Household compared | Household changed | Invented compared | Invented changed |\n'
              + '|---|---|---|---|---|\n'
              + FAMILIES.map((name, n) => '| ' + name + ' | ' + rows[n].join(' | ') + ' |').join('\n') + '\n\n'
              + 'Invented inputs: ' + inputs.common + ' compared like for like; ' + inputs.added + ' added; '
              + inputs.edited + ' edited; ' + inputs.removed + ' removed; ' + inputs.moved + ' fields moved on unedited inputs.\n'
              + 'Household dated opening input: ' + digestState('check.household.input.sha256') + '.\n'
              + 'Snapshot collector: ' + digestState('check.collector.sha256') + '.\n'
              + 'Field classes: ' + CLASSES.length + ' declared; ' + observed + ' observed by at least one input; '
              + byHousehold + ' observed by the household dated opening; ' + byInvented + ' observed by invented inputs; '
              + unobserved + ' observed by no input.\n'
              + 'Coverage manifest: ' + (invalid === 0 ? 'reconciled with the captured fields.'
                : 'INVALID; ' + invalid + ' entries are missing, extra, malformed or unreconciled.') + '\n'
              + 'Total: ' + compared + ' compared; ' + changed + ' changed.\n'
              + 'Financial values and raw diagnostics are withheld.\n'
              + 'Not covered: household figures at a live opening (private route only); page rendering and page-side decisions, '
              + 'including the PA-5 unavailable verdict and ATLAS-080 settlement qualification; persisted or adjusted page knobs; '
              + 'spending-period history on invented inputs that declare none; branches inside an observed field class.\n'
              + (withheld && incomplete
                ? 'Figures acceptance: WITHHELD and INCOMPLETE until the owner privately reconciles the exact-base/head '
                  + 'figure-level diff with the merge card and every declared field class is observed by at least one input.'
                : withheld
                  ? 'Figures acceptance: WITHHELD until the owner privately reconciles the exact-base/head figure-level diff '
                    + 'with the merge card.'
                  : incomplete
                    ? 'Figures acceptance: INCOMPLETE until every declared field class is observed by at least one input and '
                      + 'the coverage manifest reconciles; an unchanged comparison does not cover unobserved classes.'
                    : 'Figures acceptance: no compared field moved on the household dated opening or the invented inputs; '
                      + 'items listed as not covered are outside this result.') + '\n';
            if (body !== expected) throw new Error('invalid-public-summary');
            const headSha = context.payload.pull_request.head.sha;
            const baseSha = context.payload.pull_request.base.sha;
            if (!/^[a-f0-9]{40}$/.test(headSha) || !/^[a-f0-9]{40}$/.test(baseSha))
              throw new Error('invalid-review-revisions');
            const live = (await github.rest.pulls.get({ ...context.repo,
              pull_number: context.payload.pull_request.number })).data;
            if (live.head.sha !== headSha || live.base.sha !== baseSha)
              throw new Error('stale-review-revisions');
            body += `\nComparison revisions: base \`${baseSha}\`; head \`${headSha}\`.\n`;

            // One comment per PR, updated in place — a new comment on every push
            // would bury the thread it is supposed to inform.
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }))
              .find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            if (withheld && incomplete) core.setFailed(
              'Figures acceptance withheld and coverage incomplete: private exact-base/head figure-level reconciliation is required, and a declared field class is unobserved or the coverage manifest does not reconcile.');
            else if (withheld) core.setFailed(
              'Figures acceptance withheld: private exact-base/head figure-level reconciliation is required; public counts do not complete it.');
            else if (incomplete) core.setFailed(
              'Figures coverage incomplete: a declared field class is observed by no input or the coverage manifest does not reconcile; an unchanged comparison does not cover it.');
            } catch (error) {
              try { fs.writeFileSync(process.env.RUNNER_TEMP + '/figures-post.private.log',
                String(error.stack || error), { mode: 0o600 }); } catch { /* Fail closed even if storage failed. */ }
              core.setFailed('Published figures summary failed; raw diagnostics withheld.');
            }
