services:
  - type: web
    name: household-finances
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # SITE_PASSWORD is required. The server refuses to start without it, so a
      # misconfigured deploy can never serve the data publicly.
      - key: SITE_PASSWORD
        sync: false          # set by hand in the Render dashboard
      - key: SESSION_SECRET
        generateValue: true  # Render generates and stores a random value
      - key: NODE_VERSION
        value: "24.22.1"
      # On-demand read-only live overlay. No scheduler. No canonical write.
      - key: ATLAS_LIVE_OVERLAY
        value: "live"
      # Owner-supplied Lunch Money GET-only token. Never commit a value.
      - key: LUNCHMONEY_ACCESS_TOKEN
        sync: false
      # Owner-supplied atlas-provider-account-map/v1 JSON. Never commit a value.
      - key: ATLAS_PROVIDER_ACCOUNT_MAP_JSON
        sync: false
      # Dedicated read-only assistant Bearer secret. Never the browser password.
      # Unset → GET /assistant/current returns 503. Never commit a value.
      - key: ATLAS_ASSISTANT_TOKEN
        sync: false
      # OAuth protected-resource configuration for POST /assistant/mcp.
      # Values come from the chosen external OAuth authorization server; Atlas
      # does not store users, issue tokens, or run a second login system.
      - key: ATLAS_MCP_RESOURCE_URL
        sync: false
      - key: ATLAS_OAUTH_ISSUER
        sync: false
      - key: ATLAS_OAUTH_JWKS_URI
        sync: false
      # Dedicated Atlas Talk Gemini product secret. Never commit a value.
      # Unset → Talk answers stay unavailable; Send stays disabled.
      # Do not reuse SITE_PASSWORD, SESSION_SECRET, ATLAS_ASSISTANT_TOKEN,
      # Lunch Money, MCP, Grok, or any other existing secret.
      - key: ATLAS_TALK_GEMINI_API_KEY
        sync: false
      # Settlement production composition (Plan #5 assembly). NAMES ONLY:
      # every value is owner-supplied at activation and stays unset until
      # then — with none set, the host is inactive and the app serves its
      # current behaviour. Direct-session Postgres profiles for the Free
      # Neon target; never a transaction-pooler endpoint. The household
      # ID is assigned by the owner; the key ceremony and activation
      # approval remain owner decisions.
      - key: SETTLEMENT_FINANCIAL_DB_HOST
        sync: false
      - key: SETTLEMENT_FINANCIAL_DB_PORT
        sync: false
      - key: SETTLEMENT_FINANCIAL_DB_NAME
        sync: false
      - key: SETTLEMENT_FINANCIAL_DB_USER
        sync: false
      - key: SETTLEMENT_FINANCIAL_DB_PASSWORD
        sync: false
      - key: SETTLEMENT_FINANCIAL_DB_SSL_SERVERNAME
        sync: false
      - key: SETTLEMENT_FINANCIAL_DB_SCHEMA
        sync: false
      - key: SETTLEMENT_FINANCIAL_DB_SCOPE
        sync: false
      - key: SETTLEMENT_AUTH_DB_HOST
        sync: false
      - key: SETTLEMENT_AUTH_DB_PORT
        sync: false
      - key: SETTLEMENT_AUTH_DB_NAME
        sync: false
      - key: SETTLEMENT_AUTH_DB_USER
        sync: false
      - key: SETTLEMENT_AUTH_DB_PASSWORD
        sync: false
      - key: SETTLEMENT_AUTH_DB_SSL_SERVERNAME
        sync: false
      - key: SETTLEMENT_AUTH_DB_SCHEMA
        sync: false
      - key: SETTLEMENT_AUTH_DB_SCOPE
        sync: false
      - key: SETTLEMENT_HOUSEHOLD_ID
        sync: false
      - key: SETTLEMENT_ORIGIN
        sync: false
      - key: SETTLEMENT_CONTEXT_DOMAIN
        sync: false
      - key: SETTLEMENT_EXCLUSION_LEDGER_NAMESPACE
        sync: false
      - key: SETTLEMENT_EXCLUSION_SERIALIZATION_AUTHORITY
        sync: false
      - key: SETTLEMENT_EXCLUSION_HISTORY_AUTHORITY
        sync: false
      - key: SETTLEMENT_ANCHOR_PREFIX
        sync: false
      - key: SETTLEMENT_ANCHOR_SCHEMA
        sync: false
      # Durable custody profile (GAP-1 stores): its OWN direct-session
      # profile, schema and scope — never the adapter schema above.
      # Names only; values are owner-supplied at activation. With none
      # set, custody stays on the preparatory P1 binding.
      - key: SETTLEMENT_CUSTODY_DB_HOST
        sync: false
      - key: SETTLEMENT_CUSTODY_DB_PORT
        sync: false
      - key: SETTLEMENT_CUSTODY_DB_NAME
        sync: false
      - key: SETTLEMENT_CUSTODY_DB_USER
        sync: false
      - key: SETTLEMENT_CUSTODY_DB_PASSWORD
        sync: false
      - key: SETTLEMENT_CUSTODY_DB_SSL_SERVERNAME
        sync: false
      - key: SETTLEMENT_CUSTODY_DB_SCHEMA
        sync: false
      - key: SETTLEMENT_CUSTODY_DB_SCOPE
        sync: false
